<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 · Tariro opens the invite and enters the code</title>
<link rel="stylesheet" href="../assets/bundle.css">
<link rel="stylesheet" href="../assets/icons.css">
<link rel="stylesheet" href="../assets/icons-tl.css">
<link rel="stylesheet" href="../assets/icons-ob.css">
<link rel="stylesheet" href="../assets/teams.css">
<link rel="stylesheet" href="../assets/timeline.css">
<link rel="stylesheet" href="../assets/onboarding.css">
<link rel="stylesheet" href="../assets/w2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#ffffff}</style>
</head>
<body>
<div class="cx phone" data-theme="corelith">
  <div class="w2-url"><span class="i i-lock i-sm"></span>corelith.co.zw/join</div>
  <div class="w2-join">
    <span class="wsmark wsmark-40 w2-join__mark" style="background: var(--surface); box-shadow: var(--shadow-ring)"><img src="../assets/img/logo-mark.svg" alt="" width="22" height="25"></span>
    <h1 class="headline" style="font-size: 28px">Join Corelith</h1>
    <div class="w2-from"><span class="face face-24"><span class="i i-person i-sm"></span></span><span><b>Tatenda Chinyamakobvu</b> · 11:53</span></div>
    <dl class="kv" style="grid-template-columns: 96px minmax(0, 1fr); margin-top: var(--s3)">
      <dt><span class="i i-person"></span>You</dt><dd>Tariro Mhlanga</dd>
      <dt><span class="i i-tag"></span>Role</dt><dd>Field worker</dd>
      <dt><span class="w2-pmark" style="width: 14px; height: 14px"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="#26251f"/><path d="M8 17V7h5a3.2 3.2 0 0 1 0 6.4H8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Product</dt><dd>Pabasa</dd>
    </dl>
    <div class="cx-field" style="margin-top: var(--s4)"><span class="cx-label" style="display: flex; align-items: center; gap: 6px">Code sent to <span class="mark-wa" style="width: 14px; height: 14px"></span>+263 77 540 2186</span>
      <div class="w2-code"><span>4</span><span>1</span><span>7</span><span>2</span><span class="is-now"></span><span></span></div>
    </div>
  </div>
  <div class="pin"><button class="btn btn--primary btn--block" type="button" style="height: 48px">Join Corelith</button></div>
  <div class="w2-by"><span class="brandmark"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="#26251f"/><path d="M8 17V7h5a3.2 3.2 0 0 1 0 6.4H8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Pabasa</span><span class="muted">by Corelith</span></div>
</div>
</body>
</html>
