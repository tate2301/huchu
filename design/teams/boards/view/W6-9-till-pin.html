<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter Mini: Rumbidzai signs in with her PIN</title>
<link rel="stylesheet" href="../assets/bundle.css">
<link rel="stylesheet" href="../assets/icons.css">
<link rel="stylesheet" href="../assets/icons-tl.css">
<link rel="stylesheet" href="../assets/icons-ob.css">
<link rel="stylesheet" href="../assets/icons-w6.css">
<link rel="stylesheet" href="../assets/teams.css">
<link rel="stylesheet" href="../assets/timeline.css">
<link rel="stylesheet" href="../assets/onboarding.css">
<link rel="stylesheet" href="../assets/w6.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#ffffff}</style>
</head>
<body>
<div class="cx w6-board" data-theme="tender"><div class="w6-dev"><div class="w6-scr">
  <div class="w6-scr__bar"><span class="wsmark" style="width: 26px; height: 26px; border-radius: 7px; background: #b84a0c"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M3 20V5l5 6 4-6 4 6 5-6v15h-4v-7l-5 6-5-6v7z"/></svg></span><span class="strong" style="font-size: 15px">Mufaro Hardware</span><span class="muted">· Till 1</span><span class="spacer"></span><span class="i i-w6-wifi"></span><span style="font-variant-numeric: tabular-nums">11:02</span></div>
  <div style="flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0">
    <div style="padding: 40px 40px; display: flex; flex-direction: column; gap: 24px; border-right: 1px solid var(--line)">
      <h1 class="w6-big" style="font-size: 28px">Who's selling?</h1>
      <div class="w6-who">
        <div class="w6-who__p w6-who__p--on"><img class="face" src="../assets/img/rumbidzai.jpg" alt="">Rumbidzai<small>Cashier</small></div>
        <div class="w6-who__p"><img class="face" src="../assets/img/tendai.jpg" alt="">Tendai<small>Shop manager</small></div>
        <div class="w6-who__p"><img class="face" src="../assets/img/nyasha.jpg" alt="">Nyasha<small>Owner</small></div>
      </div>
    </div>
    <div style="padding: 32px 40px; display: flex; flex-direction: column; gap: 22px; justify-content: center; background: var(--ground)">
      <div style="text-align: center; color: var(--ink); font-weight: 600; font-size: 18px">Rumbidzai's PIN</div>
      <div class="w6-dots" aria-label="2 of 4 digits"><b class="on"></b><b class="on"></b><b></b><b></b></div>
      <div class="w6-keys"><button class="w6-key" type="button">1</button><button class="w6-key" type="button">2</button><button class="w6-key" type="button">3</button><button class="w6-key" type="button">4</button><button class="w6-key w6-key--down" type="button">5</button><button class="w6-key" type="button">6</button><button class="w6-key" type="button">7</button><button class="w6-key" type="button">8</button><button class="w6-key" type="button">9</button><button class="w6-key" type="button" aria-label="Delete"><span class="i i-w6-backspace"></span></button><button class="w6-key" type="button">0</button><button class="w6-key w6-key--go" type="button" aria-label="Sign in"><span class="i i-w6-signin" style="color: var(--on-action)"></span></button></div>
    </div>
  </div>
</div></div></div>
</body>
</html>
