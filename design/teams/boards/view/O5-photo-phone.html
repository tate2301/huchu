<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photographing the printed extras list on the phone</title>
<link rel="stylesheet" href="../assets/bundle.css">
<link rel="stylesheet" href="../assets/icons.css">
<link rel="stylesheet" href="../assets/icons-ob.css">
<link rel="stylesheet" href="../assets/teams.css">
<link rel="stylesheet" href="../assets/onboarding.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#ffffff}</style>
</head>
<body>
<div class="cx phone" data-theme="corelith" style="background: #121210">
  <div class="ob-pbar-dark">
    <button class="btn btn--quiet btn--icon" type="button" aria-label="Close" style="color: #fff"><span class="i i-x"></span></button>
    <span class="pbar__t">Photograph a price list</span>
    <span class="spacer"></span>
    <span style="color: rgba(255,255,255,.7); font-size: var(--t-sm); padding-right: 8px">Page 2</span>
  </div>
  <div class="ob-cam">
    <div class="ob-cam__wall"></div>
    <div style="position: relative">
      <div class="ob-paper">
        <span class="ob-paper__pin"></span>
        <div class="ob-paper__h">Kuda Interiors · Extras, 2026</div>
        <div style="font-family: var(--font-sans); font-size: 9px; color: #6f6a5f">Page 2 of 2 · prices in US$, VAT included</div>
        <div class="ob-paper__r"><span>Corner carousel</span><span>120.00 each</span></div>
        <div class="ob-paper__r"><span>Plinth light</span><span>14.00 each</span></div>
        <div class="ob-paper__r"><span>Adjustable shelf, oak</span><span>18.00 each</span></div>
        <div class="ob-paper__r"><span>Wine rack insert</span><span>45.00 each</span></div>
        <div style="margin-top: 10px; font-family: var(--font-sans); font-size: 9px; color: #6f6a5f">Ask Rudo before quoting anything not on this list.</div>
      </div>
      <span class="ob-corner ob-corner--tl" style="left: -12px; top: -14px"></span>
      <span class="ob-corner ob-corner--tr" style="right: -12px; top: -20px"></span>
      <span class="ob-corner ob-corner--bl" style="left: -8px; bottom: -14px"></span>
      <span class="ob-corner ob-corner--br" style="right: -16px; bottom: -8px"></span>
    </div>
  </div>
  <div style="flex: none; background: #121210; color: rgba(255,255,255,.72); text-align: center; font-size: var(--t-cap); padding: 12px 24px 0"></div>
  <div class="ob-shoot">
    <div><div class="ob-shot" aria-label="1 page taken"><i></i><i></i><i></i><i></i><i></i><i></i><span class="ob-shot__n">1</span></div></div>
    <button class="ob-shutter" type="button" aria-label="Take page 2"><i></i></button>
    <button class="ob-done" type="button"><span class="i i-check"></span>Done</button>
  </div>
</div>
</body>
</html>
