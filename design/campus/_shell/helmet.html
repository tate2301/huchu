<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&family=Atkinson+Hyperlegible+Mono:wght@400..700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F7F8FA;color:#262A33;
      font-family:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',sans-serif;
      font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
    a{color:#0944C2;text-decoration:none}
    a:hover{color:#08379C;text-decoration:underline}
    svg{display:block}
    .mono{font-family:'Atkinson Hyperlegible Mono','SF Mono',ui-monospace,monospace}
    .nav:hover{background:#F1F3F6}
    .row:hover{background:#F7F8FA}
    .btn:hover{background:#F1F3F6}
    .pri:hover{background:#0944C2}
    .scroll::-webkit-scrollbar{width:10px;height:10px}
    .scroll::-webkit-scrollbar-thumb{background:#D2D7E0;border-radius:5px;border:3px solid transparent;background-clip:padding-box}
    .scroll::-webkit-scrollbar-track{background:transparent}
  </style>
</helmet>
