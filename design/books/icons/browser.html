<title>Corelith Icons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the Corelith shell, edge to edge. Left rail of sets, styles and categories; the grid fills the rest; the chosen icon opens beside it. */
:root{
  --ground:#f6f6f4; --surface:#ffffff; --ink:#18191b; --ink-2:#4a4c50; --muted:#7c7e83; --line:#e6e5e1; --fill:#efeeea; --accent:#2f5bea; --accent-ink:#ffffff; --sel:#e9eefc;
  --f-ui:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#121314;--surface:#18191b;--ink:#ededeb;--ink-2:#b9bab8;--muted:#86888c;--line:#2a2b2e;--fill:#222326;--accent:#6f8cff;--accent-ink:#0d0f14;--sel:#1f2740;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#121314;--surface:#18191b;--ink:#ededeb;--ink-2:#b9bab8;--muted:#86888c;--line:#2a2b2e;--fill:#222326;--accent:#6f8cff;--accent-ink:#0d0f14;--sel:#1f2740;color-scheme:dark}
html,body{height:100%}
body{background:var(--surface);color:var(--ink);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;height:100%;min-height:0}
.side{background:var(--ground);box-shadow:inset -1px 0 0 var(--line);overflow:auto;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;box-shadow:inset 0 -1px 0 var(--line);font-weight:600}
.brand svg{width:22px;height:22px}
.grp{padding:12px 8px 4px;display:flex;flex-direction:column;gap:2px}
.grp h3{font-size:12px;font-weight:500;color:var(--muted);padding:4px 8px}
.it{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:8px;border:0;background:none;color:var(--ink-2);font:inherit;text-align:left;cursor:pointer;width:100%}
.it svg{width:18px;height:18px;flex:none;color:var(--ink-2)}
.it .n{margin-left:auto;font:12px var(--f-mono);color:var(--muted)}
.it:hover{background:var(--fill)}
.it[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.it:focus-visible,.cell:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;box-shadow:inset 0 -1px 0 var(--line);flex:none}
.find{flex:1;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;background:var(--ground);box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.find svg{width:18px;height:18px;color:var(--muted);flex:none}
.find input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);outline:none}
.kbd{font:12px var(--f-mono);color:var(--muted);padding:1px 6px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line)}
.seg{display:flex;padding:2px;border-radius:8px;background:var(--ground);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.seg button{border:0;background:none;font:12px var(--f-mono);color:var(--muted);height:30px;padding:0 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.count{font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
.scroll{overflow:auto;flex:1;min-height:0}
.sec h2{position:sticky;top:0;z-index:1;background:var(--surface);font-size:13px;font-weight:600;padding:12px 16px 8px;box-shadow:inset 0 -1px 0 var(--line);display:flex;gap:8px}
.sec h2 span{font:12px var(--f-mono);color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:104px;border:0;background:var(--surface);color:var(--ink);box-shadow:inset -1px -1px 0 var(--line);cursor:pointer;font:inherit;padding:8px 4px}
.cell svg{flex:none}
.cell .nm{font:11px var(--f-mono);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell:hover{background:var(--ground)}
.cell[aria-pressed="true"]{background:var(--sel)}
.cell[aria-pressed="true"] .nm{color:var(--ink)}
.empty{padding:32px 16px;color:var(--muted)}
.detail{box-shadow:inset 1px 0 0 var(--line);overflow:auto;display:flex;flex-direction:column;padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;box-shadow:inset 0 -1px 0 var(--line);flex:none}
.dh b{font:500 14px var(--f-mono)}
.dh .cat{margin-left:auto;font-size:12px;color:var(--muted)}
.stage{display:grid;place-items:center;height:200px;background:var(--ground);box-shadow:inset 0 -1px 0 var(--line);color:var(--ink);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:8px 8px;background-position:center}
.stage svg{width:144px;height:144px;background:var(--ground)}
.sizes{display:flex;align-items:flex-end;justify-content:space-around;padding:16px;box-shadow:inset 0 -1px 0 var(--line)}
.sizes div{display:flex;flex-direction:column;align-items:center;gap:6px;font:11px var(--f-mono);color:var(--muted)}
.styles{display:grid;grid-template-columns:repeat(4,1fr);box-shadow:inset 0 -1px 0 var(--line)}
.styles button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:0;background:none;color:var(--ink);cursor:pointer;font:11px var(--f-mono)}
.styles button span{color:var(--muted)}
.styles button[aria-pressed="true"]{background:var(--sel)}
.styles button[aria-pressed="true"] span{color:var(--ink)}
.blk{padding:12px 16px;box-shadow:inset 0 -1px 0 var(--line);display:flex;flex-direction:column;gap:8px}
.blk h4{font-size:12px;font-weight:500;color:var(--muted)}
.used{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink-2)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:0;font:500 13px var(--f-ui);cursor:pointer;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:none}
pre{margin:0;font:11px/1.5 var(--f-mono);color:var(--ink-2);background:var(--ground);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:140px;white-space:pre-wrap;word-break:break-all}
.toast{font-size:12px;color:var(--muted);min-height:18px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.spec dt{color:var(--muted)}.spec dd{margin:0;font-family:var(--f-mono)}
@media (max-width:1100px){.app{grid-template-columns:200px minmax(0,1fr)}.detail{grid-column:1/-1;box-shadow:inset 0 1px 0 var(--line)}html,body{height:auto}.app{height:auto}.scroll{max-height:70vh}}
@media (max-width:720px){.app{grid-template-columns:minmax(0,1fr)}.side{max-height:none;flex-direction:row;overflow-x:auto;padding-left:max(0px,env(safe-area-inset-left,0px))}.side .grp{flex-direction:row;padding:8px;flex:none}.side .grp h3{display:none}.brand{display:none}.it{width:auto;white-space:nowrap}.top{flex-wrap:wrap;height:auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.find{flex-basis:100%}.grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}.cell{height:92px}.sec h2{padding-left:max(16px,env(safe-area-inset-left,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="app">
  <aside class="side" aria-label="Filters">
    <div class="brand"><svg viewBox="0 0 18 18" aria-hidden="true" id="logo"></svg>Corelith icons</div>
    <div class="grp" id="styles"><h3>Style</h3></div>
    <div class="grp" id="cats"><h3>Category</h3></div>
  </aside>
  <main class="main">
    <div class="top">
      <label class="find"><svg viewBox="0 0 18 18" id="sicon" aria-hidden="true"></svg><input id="q" type="search" placeholder="Search 188 icons" aria-label="Search icons" autocomplete="off"><span class="kbd">/</span></label>
      <div class="seg" id="sizes" role="group" aria-label="Preview size"></div>
      <span class="count" id="count"></span>
    </div>
    <div class="scroll" id="list"></div>
  </main>
  <aside class="detail" id="detail" aria-label="Selected icon"></aside>
</div>

  ${v.u.length ? `<div class="blk"><h4>In the app</h4><ul class="used">${v.u.map(u=>`<li>${u}</li>`).join("")}</ul></div>` : ""}
  <div class="blk"><h4>Copy</h4><div class="acts"><button class="btn pri" id="cs">${svg("copy","o",16)}Copy SVG</button><button class="btn" id="cj">${svg("code","o",16)}Copy JSX</button><button class="btn" id="cn">${svg("hash","o",16)}Copy name</button></div><div class="toast" id="toast" aria-live="polite"></div><pre id="code">${code.replace(/</g,"&lt;")}</pre></div>
  <div class="blk"><h4>Grid</h4><dl class="spec"><dt>Canvas</dt><dd>18 × 18</dd><dt>Stroke</dt><dd>1.5, round caps and joins</dd><dt>Colour</dt><dd>currentColor; duo second tone at 40%</dd><dt>Tags</dt><dd>${v.t}</dd></dl></div>`;
  const copy = (t, label) => { const done = () => $("toast").textContent = `${label} copied.`; try { navigator.clipboard.writeText(t).then(done, () => sel_(label)); } catch(e) { sel_(label); } };
  const sel_ = (label) => { const r = document.createRange(); r.selectNodeContents($("code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("toast").textContent = `Couldn't reach the clipboard. The SVG is selected; press Ctrl C.`; };
  $("cs").onclick = () => copy(code, "SVG"); $("cj").onclick = () => copy(jsx, "JSX"); $("cn").onclick = () => copy(sel, "Name");
}
function all(){ side(); list(); detail(); }
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.st) { st = b.dataset.st; save(); all(); }
  else if (b.dataset.cat) { cat = b.dataset.cat; side(); list(); }
  else if (b.dataset.size) { size = +b.dataset.size; save(); side(); list(); }
  else if (b.dataset.n) { sel = b.dataset.n; document.querySelectorAll('.cell[aria-pressed="true"]').forEach(c => c.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); detail(); }
});
$("q").addEventListener("input", (e) => { q = e.target.value.trim(); list(); });
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } });
all();
</script>
