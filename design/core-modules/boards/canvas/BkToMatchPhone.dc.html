body{margin:0;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}
.sh,.rb2,.st,.ex{height:844px}

.sh{position:relative}

.bk-no{color:var(--color-danger)}

.bk-h3{font-size:14px;font-weight:600;color:var(--color-ink)}

.bk-tw{margin:0 -24px}
