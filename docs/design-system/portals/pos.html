    body[data-kit-nav="pos"] .cashup { padding: 12px; }
    body[data-kit-nav="pos"] .zrep { padding: 12px; }
    body[data-kit-nav="pos"] .tender { padding: 12px 12px calc(80px + env(safe-area-inset-bottom)); }
    body[data-kit-nav="pos"] .mrep { padding: 12px; }
    body[data-kit-nav="pos"] .ilk { padding: 12px; }
    body[data-kit-nav="pos"] .help { padding: 12px; }
    body[data-kit-nav="pos"] .parked { padding: 12px; }

    /* === Heading sizes: h1→20, h2→16, h3→14 === */
    body[data-kit-nav="pos"] .page-h h2,
    body[data-kit-nav="pos"] .mrep-hero h2,
    body[data-kit-nav="pos"] .receipt-card h2,
    body[data-kit-nav="pos"] .zrep-card h2 { font-size: 16px; line-height: 1.2; }
    body[data-kit-nav="pos"] .splitp .pane h3,
    body[data-kit-nav="pos"] .cashup .pane h3,
    body[data-kit-nav="pos"] .tender .methods h3,
    body[data-kit-nav="pos"] .help h3 { font-size: 14px; line-height: 1.2; }
    body[data-kit-nav="pos"] .pd-bar { font-size: 12px; }

    /* === Stat values cap at 22px === */
    body[data-kit-nav="pos"] .mrep-tile .v,
    body[data-kit-nav="pos"] .zrep .k .v,
    body[data-kit-nav="pos"] .cashup .variance .v,
    body[data-kit-nav="pos"] .tender .recv .cell .v { font-size: 22px !important; line-height: 1.05; }
    body[data-kit-nav="pos"] .tender .due .am { font-size: 32px; line-height: 1.05; }
    body[data-kit-nav="pos"] .tender .due .am .c { font-size: 18px; }
    body[data-kit-nav="pos"] .b-stat-hero .b-sh-lead .b-sh-v { font-size: 26px !important; line-height: 1.05; }
    body[data-kit-nav="pos"] .b-stat-hero .b-sh-s .b-sh-v { font-size: 18px !important; line-height: 1; }
    body[data-kit-nav="pos"] .view-cart-bar .v { font-size: 16px; }

    /* === Bottom-tabs safe-area === */
    body[data-kit-nav="pos"] .b-bottom-tabs { padding-bottom: env(safe-area-inset-bottom, 0px); }
    body[data-kit-nav="pos"] .pd-main { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }

    /* === Modal as bottom sheet: 95vh, scrollable, sticky foot with safe-area === */
    body[data-kit-nav="pos"] .modal {
      max-height: 95vh;
      display: flex; flex-direction: column;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
    body[data-kit-nav="pos"] .modal h3 { font-size: 16px; }
    body[data-kit-nav="pos"] .modal .sub { font-size: 13px; }
    body[data-kit-nav="pos"] .modal .acts {
      position: sticky; bottom: 0;
      background: var(--surface);
      padding-top: 10px;
      margin-top: auto;
    }
    body[data-kit-nav="pos"] .modal .acts button { min-height: 44px; font-size: 13.5px; }

    /* === x-bottom-sheet (DS) — 95vh, scroll body, sticky foot === */
    body[data-kit-nav="pos"] .x-bottom-sheet { max-height: 95vh; }
    body[data-kit-nav="pos"] .x-bottom-sheet .x-bs-foot {
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }

    /* === View-cart bar: account for safe area === */
    body[data-kit-nav="pos"] .view-cart-bar {
      bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    }

    /* === Cart sheet (mobile cart take-over) — safe area === */
    body[data-kit-nav="pos"] .cart .charge { margin-bottom: calc(14px + env(safe-area-inset-bottom)); }

    /* === Sticky tender confirm bar — safe area + above bottom tabs === */
    body[data-kit-nav="pos"] .tender .confirm {
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    }

    /* === Toast safe-area top === */
    body[data-kit-nav="pos"] .toast-host { top: calc(64px + env(safe-area-inset-top, 0px)); }

    /* === Login / open-till screens (lock + cashier list) === */
    body[data-kit-nav="pos"] .login-shell { padding: 16px; }

/* === Default settings === */

/* === Theme === */
function detectInitialTheme() {
  try {
    const stored = localStorage.getItem('huchu-pos-demo:theme');
    if (stored === 'dark' || stored === 'light') return stored;
  } catch (e) {}
  try {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';

function applyTheme(theme) {

/* === App state === */

/* === Persistence === */
const LS_KEY = 'huchu-pos-demo:v2';
const PERSIST_KEYS = ['cashier','dayOpen','forceOffline','pendingQueue','parkedSales','audit','settings','openingFloat','cashDrops','cart','shift','lastReceipt','theme'];
function saveState() {
  try {
    const slice = {};
    PERSIST_KEYS.forEach(k => { slice[k] = state[k]; });
    localStorage.setItem(LS_KEY, JSON.stringify(slice));
  } catch (e) { /* quota or disabled */ }
}
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const slice = JSON.parse(raw);
    PERSIST_KEYS.forEach(k => { if (slice[k] !== undefined) state[k] = slice[k]; });
    // merge any new settings keys
    state.settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
  } catch (e) { /* corrupt — ignore */ }
}
function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme(state.theme);
  try { localStorage.setItem('huchu-pos-demo:theme', state.theme); } catch (e) {}
  saveState();
  render();
}
function resetDemo() {
  try { localStorage.removeItem(LS_KEY); } catch (e) {}

}

/* === Audit log === */
function logAudit(type, summary, value) {

/* === Cart helpers === */
function cartSubtotal() {
  return state.cart.lines.reduce((s, l) => l.voided ? s : s + l.qty * l.price, 0);
}
function cartDiscount() {
  const sub = cartSubtotal();
  if (!state.cart.discount) return 0;
  if (state.cart.discount.type === 'pct') return +(sub * state.cart.discount.value / 100).toFixed(2);
  return Math.min(state.cart.discount.value, sub);
}
function cartTax() {
  return +((cartSubtotal() - cartDiscount()) * 0.145).toFixed(2);
}
function cartTotal() {
  return +(cartSubtotal() - cartDiscount() + cartTax()).toFixed(2);
}
function cartCount() {
  return state.cart.lines.filter(l => !l.voided).reduce((s, l) => s + l.qty, 0);
}
function addToCart(itemId) {
  const item = CATALOG.find(i => i.id === itemId);
  if (!item || item.oos) return;
  const existing = state.cart.lines.find(l => l.id === itemId && !l.voided);
  if (existing) existing.qty += 1;
  else state.cart.lines.push({ id: item.id, sku: item.sku, name: item.name, price: item.price, qty: 1, voided: false });
  render();
  // Add flash to tile
  const tile = $(`[data-item="${itemId}"]`);
  if (tile) {
    tile.classList.add('added');
    setTimeout(() => tile.classList.remove('added'), 400);
  }
}
function updateQty(itemId, delta) {
  const line = state.cart.lines.find(l => l.id === itemId && !l.voided);
  if (!line) return;
  line.qty = Math.max(0, line.qty + delta);
  if (line.qty === 0) state.cart.lines = state.cart.lines.filter(l => l !== line);
  render();
}
function voidLine(itemId) {
  const line = state.cart.lines.find(l => l.id === itemId && !l.voided);
  if (line) { line.voided = true; render(); }
}
function clearCart() {
  state.cart = { lines: [], customerId: null, discount: null };
  render();
}

}

/* === Toast === */
function toast(msg, kind = 'default') {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind !== 'default' ? ' ' + kind : '');
  const icon = kind === 'success' ? 'check' : kind === 'danger' ? 'x' : kind === 'warn' ? 'info' : 'check';
  el.innerHTML = `<span data-icon="${icon}" data-icon-size="14"></span>${escapeHtml(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, 2400);
}

/* === Modal === */
function openModal(content) { state.modal = content; renderModal(); }
function closeModal() { state.modal = null; renderModal(); }
function renderModal() {
  const host = $('#modal-host');
  if (!state.modal) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="modal-scrim" data-scrim>${state.modal}</div>`;
  if (window.Icons) window.Icons.render(host);
  host.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeModal();
  });
}

/* === PIN modal === */
function openPinModal({ title, sub, onAccept, validPin = '4321' }) {
  let pin = '';
  let error = false;
  function paint() {
    openModal(`
      <div class="modal" onclick="event.stopPropagation()">
        <h3>${escapeHtml(title)}</h3>
        <p class="sub">${escapeHtml(sub)}</p>
        <div class="otp" role="group" aria-label="4-digit PIN">
          ${[0,1,2,3].map(i => `<input type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" data-d="${i}" value="${pin[i] || ''}" aria-label="Digit ${i+1}" ${error ? 'aria-invalid="true"' : ''} />`).join('')}
        </div>
        ${error ? `<div class="pin-err">Wrong PIN. Try again.</div>` : ''}
        <div class="acts" style="margin-top: 14px;">
          <button class="btn btn-secondary" style="flex:1; justify-content:center;" data-cancel>Cancel</button>
        </div>
      </div>
    `);
    const modal = $('.modal');
    const cells = modal.querySelectorAll('[data-d]');
    const sync = () => { pin = Array.from(cells).map(c => c.value).join('').replace(/\D/g, '').slice(0, 4); };
    cells.forEach((cell, idx) => {
      cell.addEventListener('input', (e) => {
        const v = (e.target.value || '').replace(/\D/g, '').slice(-1);
        e.target.value = v;
        error = false;
        if (v && cells[idx + 1]) cells[idx + 1].focus();
        sync();
        if (pin.length === 4) {
          setTimeout(() => {
            if (pin === validPin) { closeModal(); onAccept(); }
            else { error = true; pin = ''; paint(); }
          }, 220);
        }
      });
      cell.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !cell.value && cells[idx - 1]) { cells[idx - 1].focus(); cells[idx - 1].value = ''; }
      });
    });
    if (cells[pin.length] || cells[0]) (cells[pin.length] || cells[0]).focus();
    modal.querySelector('[data-cancel]').addEventListener('click', closeModal);
  }
  paint();
}

/* === Discount modal === */
function openDiscountModal() {
  const cur = state.cart.discount;
  let type = cur ? cur.type : 'pct';
  let value = cur ? cur.value : 0;
  function paint() {
    openModal(`
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Give a discount</h3>
        <p class="sub">Takes money off the subtotal, before tax. The manager will see this.</p>
        <div class="row">
          <div class="seg">
            <button class="${type==='pct'?'on':''}" data-t="pct">Percent</button>
            <button class="${type==='amt'?'on':''}" data-t="amt">Amount</button>
          </div>
        </div>
        <div class="row">
          <input type="number" min="0" step="0.5" value="${value}" id="dval" autofocus />
          <span style="display:grid; place-items:center; padding: 0 12px; background: var(--surface-muted); border-radius: 8px; font: 600 14px var(--font-sans); color: var(--text-strong);">${type==='pct'?'%':'$'}</span>
        </div>
        <div class="acts">
          <button class="alt" data-clear>Remove</button>
          <button class="ok" data-ok>Give discount</button>
        </div>
      </div>
    `);
    const modal = $('.modal');
    modal.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => {
      type = b.dataset.t;
      value = +modal.querySelector('#dval').value || 0;
      paint();
    }));
    modal.querySelector('[data-ok]').addEventListener('click', () => {
      const v = +modal.querySelector('#dval').value || 0;
      if (v <= 0) { state.cart.discount = null; }
      else state.cart.discount = { type, value: v };
      closeModal(); render();
      toast(v > 0 ? 'Discount given' : 'Discount removed', 'success');
    });
    modal.querySelector('[data-clear]').addEventListener('click', () => {
      state.cart.discount = null; closeModal(); render();
    });
  }
  paint();
}

/* === Router === */
function go(route) {
  state.route = route;
  state.cartOpen = false; // close mobile cart sheet on navigation
  history.replaceState(null, '', '#/' + route);
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => {
  const r = (location.hash.replace(/^#\/?/, '') || 'sale');
  if (state.route !== r) { state.route = r; render(); }
});

/* === Render === */
function render() {
  saveState();

  if (!state.cashier) {
    $('#app').innerHTML = renderLogin();

  if (!state.dayOpen && state.route !== 'help' && state.route !== 'settings' && state.route !== 'audit' && state.route !== 'z-report' && state.route !== 'my-reports') {
    // If day not open, route every non-info screen to open-till
    if (state.route !== 'open-till') state.route = 'open-till';
  }
  $('#app').innerHTML = `
    <div class="pd-app">
      ${renderSide()}

function toggleFullscreen() {
  const isFs = !!document.fullscreenElement;
  if (isFs) {
    document.exitFullscreen().catch(() => {});
    document.body.classList.remove('is-fullscreen');
  } else {
    document.body.classList.add('is-fullscreen');
    document.documentElement.requestFullscreen?.().catch(() => {
      // Fullscreen API blocked (cross-origin iframe etc.) — class-based fullscreen still works
    });
  }
  // Re-render to update the icon
  render();
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.body.classList.remove('is-fullscreen');
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('is-fullscreen') && !document.fullscreenElement) {
    document.body.classList.remove('is-fullscreen');
    render();
  }
});

/* === Park current sale === */
function parkCurrentSale(note) {
  if (state.cart.lines.length === 0) return;
  const id = 'P-' + Math.floor(Math.random() * 10000).toString().padStart(4, '0');
  state.parkedSales.push({
    id, ts: new Date().toISOString().slice(0, 16).replace('T', ' '),
    lines: state.cart.lines.map(l => ({...l})),
    customerId: state.cart.customerId,
    discount: state.cart.discount,
    notes: note || state.cart.notes || '',
    who: state.cashier ? state.cashier.name : '',
  });
  logAudit('sale', `Parked sale ${id} · ${cartCount()} items · ${money(cartTotal())}`, cartTotal());
  state.cart = { lines: [], customerId: null, discount: null, notes: '' };
  saveState();
}
function recallParkedSale(id) {
  const idx = state.parkedSales.findIndex(p => p.id === id);
  if (idx < 0) return;
  const p = state.parkedSales[idx];
  if (state.cart.lines.length > 0) parkCurrentSale('Auto-parked on recall');
  state.cart = {
    lines: p.lines.map(l => ({...l})),
    customerId: p.customerId,
    discount: p.discount,
    notes: p.notes,
  };
  state.parkedSales.splice(idx, 1);
  logAudit('sale', `Recalled parked ${p.id}`);
  go('sale');
}

function openVoidFlow(itemId) {
  const line = state.cart.lines.find(l => l.id === itemId);
  if (!line) return;
  let reason = null;
  const reasons = ['Wrong item', 'Customer changed mind', 'Damaged', 'Other'];
  function paint() {
    openModal(`
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Remove "${escapeHtml(line.name)}"?</h3>
        <p class="sub">Pick a reason. A manager needs to approve this with their PIN.</p>
        <div class="b-filter-chips" style="padding: 4px 0 12px; flex-wrap: wrap;">
          ${reasons.map(r => `<button type="button" class="b-fc ${reason === r ? 'on' : ''}" data-r="${r}">${r}</button>`).join('')}
        </div>
        <div class="acts">
          <button class="alt" data-cancel>Cancel</button>
          <button class="ok" data-ok ${reason ? '' : 'disabled'} style="${reason ? '' : 'opacity:0.5; cursor:not-allowed;'}">Continue</button>
        </div>
      </div>
    `);
    const m = $('.modal');
    m.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { reason = b.dataset.r; paint(); }));
    m.querySelector('[data-cancel]').addEventListener('click', closeModal);
    m.querySelector('[data-ok]').addEventListener('click', () => {
      if (!reason) return;
      openPinModal({ title: 'Manager PIN', sub: 'Use 4321 for the demo.', onAccept: () => { voidLine(itemId); toast('Item removed: ' + reason, 'success'); } });
    });
  }
  paint();
}

function wireTender() {
  $$('[data-m]').forEach(b => b.addEventListener('click', () => { state.tender.method = b.dataset.m; state.tender.received = 0; render(); }));
  $$('[data-tq]').forEach(b => b.addEventListener('click', () => {
    const val = b.dataset.tq;
    if (val === 'exact') state.tender.received = cartTotal();
    else state.tender.received = +val;
    render();
  }));
  $$('[data-k]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    let cur = state.tender.received.toString();
    if (cur === '0') cur = '';
    if (k === 'clr') cur = '0';
    else if (k === '.' && cur.includes('.')) {}
    else cur += k;
    state.tender.received = +cur || 0;
    render();
  }));
  $$('[data-sim]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.sim === 'card-decline') { toast('Card refused. Ask the customer to try another way.', 'danger'); return; }
    state.tender.processing = true; render();
    setTimeout(() => completeSale(), 900);
  }));
  const cancel = $('[data-cancel]'); if (cancel) cancel.addEventListener('click', () => go('sale'));
  const ok = $('[data-confirm]'); if (ok) ok.addEventListener('click', () => {
    if (state.tender.method === 'cash' && state.tender.received < cartTotal()) return;
    state.tender.processing = true; render();
    setTimeout(() => completeSale(), 900);
  });
}

function completeSale() {
  const total = cartTotal();
  const sub = cartSubtotal();
  const tax = cartTax();
  const disc = cartDiscount();
  const change = state.tender.method === 'cash' ? state.tender.received - total : 0;
  state.lastReceipt = {
    id: 'R-' + (19500 + Math.floor(Math.random() * 100)),
    lines: state.cart.lines.filter(l => !l.voided).map(l => ({...l})),
    customer: state.cart.customerId ? CUSTOMERS.find(c => c.id === state.cart.customerId) : null,
    subtotal: sub, discount: disc, tax, total,
    method: state.tender.method, received: state.tender.received, change,
    ts: new Date().toISOString().slice(0, 16).replace('T', ' '),
  };
  // Reset cart but keep receipt
  state.cart = { lines: [], customerId: null, discount: null };
  state.tender = { method: 'cash', received: 0, processing: false };
  go('receipt');
}

const DENOMS = [

function countedTotal() {
  return DENOMS.reduce((s, d) => s + d.v * (state.shift.counted[String(d.v)] || 0), 0);

function renderCashup() {
  const exp = state.shift.expected;

  let varKind = 'ok'; let varTtl = 'Looks good';
  if (absVar > 10) { varKind = 'bad'; varTtl = 'Too far off — needs a manager to check'; }
  else if (absVar > 2) { varKind = 'warn'; varTtl = 'Small difference — count again to be sure'; }
  if (absVar === 0) { varTtl = 'Exact match'; }
  const expTotal = exp.cash + exp.card + exp.mobile + exp.credit;

  return `
    <div class="cashup">
      <div class="page-h" style="margin-bottom: 16px;">
        <div style="flex:1;">
          <h2>End shift S-2841 (cash-up)</h2>

        </div>
        <div style="display:flex; gap:6px; align-items: center; font: 13px var(--font-sans); color: var(--text-muted);">

        </div>
      </div>
      <div class="cashup-grid">

          <h3>What the receipts say <span style="font: 11px var(--font-mono); color: var(--text-muted);">147 sales</span></h3>

          <div class="ex-row"><span>Card · ZimSwitch</span><span class="v">${money(exp.card)}</span></div>
          <div class="ex-row"><span>Mobile money · EcoCash + OneMoney</span><span class="v">${money(exp.mobile)}</span></div>
          <div class="ex-row"><span>Store credit</span><span class="v">${money(exp.credit)}</span></div>
          <div class="ex-row total"><span>Total you should have</span><span class="v">${money(expTotal)}</span></div>
        </div>
        <div class="pane">
          <h3>Count the cash <span style="font: 11px var(--font-mono); color: var(--text-muted);">Counted so far: ${money(cashCounted)}</span></h3>
          ${DENOMS.map(d => {
            const c = state.shift.counted[String(d.v)] || 0;
            const ln = d.v * c;
            return `
              <div class="den">
                <span class="dn">${d.l}</span>
                <div class="ctrl">
                  <button data-cd="dec" data-v="${d.v}">−</button>

                </div>
                <span class="ln">${money(ln)}</span>
              </div>
            `;
          }).join('')}
        </div>
        <div class="variance ${varKind}">
          <div class="ic"><span data-icon="${varKind==='ok'?'check':varKind==='warn'?'info':'asterisk'}" data-icon-size="18"></span></div>
          <div>
            <div class="ttl">${varTtl}</div>
            <div class="sb">Cash ${variance >= 0 ? 'over' : 'short'} by ${money(absVar)} · up to $10 either way is fine</div>
          </div>
          <div class="v">${variance >= 0 ? '+' : '–'} ${money(absVar)}</div>
        </div>
        <div class="submit">
          <button class="alt" id="cu-reset">Clear count</button>
          <button class="ok" id="cu-close">End shift</button>
        </div>
      </div>
    </div>
  `;
}
function wireCashup() {
  $$('[data-cd]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v; const cur = state.shift.counted[v] || 0;
    state.shift.counted[v] = Math.max(0, cur + (b.dataset.cd === 'inc' ? 1 : -1));
    render();
  }));
  $$('[data-ci]').forEach(i => i.addEventListener('input', (e) => {
    state.shift.counted[i.dataset.v] = Math.max(0, +e.target.value || 0);
    // don't full re-render on input
    const tot = $('.cashup-grid .pane:nth-of-type(2) h3 span');
    if (tot) tot.textContent = 'Counted so far: ' + money(countedTotal());
  }));
  const rst = $('#cu-reset'); if (rst) rst.addEventListener('click', () => {
    DENOMS.forEach(d => state.shift.counted[String(d.v)] = 0);
    render(); toast('Count cleared');
  });
  const cls = $('#cu-close'); if (cls) cls.addEventListener('click', () => {
    const variance = countedTotal() - state.shift.expected.cash;
    if (Math.abs(variance) > 10) {
      openPinModal({ title: 'Manager PIN', sub: 'Cash is off by ' + money(Math.abs(variance)) + ' — too far. A manager needs to approve. Use 4321 for the demo.', onAccept: () => {
        toast('Shift ended with manager approval', 'warn');
      }});
    } else {
      toast('Shift S-2841 ended — all good', 'success');
    }
  });
}

        `}

function wireLogin() {
  $$('[data-lc]').forEach(b => b.addEventListener('click', () => {
    state._loginSel = CASHIERS.find(c => c.id === b.dataset.lc);
    state._loginPin = ''; state._loginErr = false;
    render();
  }));
  const cells = $$('[data-lpd-cell]');
  const sync = () => { state._loginPin = cells.map(c => c.value).join('').replace(/\D/g, '').slice(0, 4); };
  cells.forEach((cell, idx) => {
    cell.addEventListener('input', (e) => {
      const v = (e.target.value || '').replace(/\D/g, '').slice(-1);
      e.target.value = v;
      state._loginErr = false;
      if (v && cells[idx + 1]) cells[idx + 1].focus();
      sync();
      if (state._loginPin.length === 4) {
        const sel = state._loginSel;
        setTimeout(() => {
          if (sel && state._loginPin === sel.pin) {
            state.cashier = { id: sel.id, name: sel.name, role: sel.role };
            state._loginPin = ''; state._loginSel = null;
            logAudit('shift', `Signed in: ${state.cashier.name} (${state.cashier.role})`);
            if (!state.dayOpen) { state.route = 'open-till'; }
            render();
          } else {
            state._loginErr = true; state._loginPin = '';
            render();
          }
        }, 200);
      }
    });
    cell.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !cell.value && cells[idx - 1]) { cells[idx - 1].focus(); cells[idx - 1].value = ''; sync(); }
      if (e.key === 'ArrowLeft' && cells[idx - 1]) cells[idx - 1].focus();
      if (e.key === 'ArrowRight' && cells[idx + 1]) cells[idx + 1].focus();
    });
  });
  if (cells.length) {
    const focusCell = cells[Math.min((state._loginPin || '').length, cells.length - 1)];
    if (focusCell) focusCell.focus();
  }
  const back = $('[data-lpd-back]'); if (back) back.addEventListener('click', () => { state._loginSel = null; state._loginPin = ''; render(); });
  const rm = $('#lp-remember'); if (rm) rm.addEventListener('change', (e) => { state._loginRemember = e.target.checked; });
}

function cashDropTotal() {
  if (!state._cashDropCount) state._cashDropCount = {};
  return DENOMS.reduce((s, d) => s + d.v * (state._cashDropCount[d.v] || 0), 0);

function wireCashDrop() {
  $$('[data-cdm]').forEach(b => b.addEventListener('click', () => { state._cashDropMode = b.dataset.cdm; render(); }));
  $$('[data-cdd]').forEach(b => b.addEventListener('click', () => {
    if (!state._cashDropCount) state._cashDropCount = {};
    const v = b.dataset.v; const cur = state._cashDropCount[v] || 0;
    state._cashDropCount[v] = Math.max(0, cur + (b.dataset.cdd === 'inc' ? 1 : -1));
    render();
  }));
  $$('[data-cdi]').forEach(i => i.addEventListener('input', (e) => {
    if (!state._cashDropCount) state._cashDropCount = {};
    state._cashDropCount[i.dataset.v] = Math.max(0, +e.target.value || 0);
    render();
  }));
  const cc = $('#cd-cancel'); if (cc) cc.addEventListener('click', () => { state._cashDropCount = {}; go('sale'); });
  const ok = $('#cd-ok'); if (ok) ok.addEventListener('click', () => {
    const amt = cashDropTotal();
    const reason = $('#cd-reason').value;
    const mode = state._cashDropMode || 'drop';

      toast(`${mode === 'drop' ? 'Dropped' : 'Picked up'} ${money(amt)}`, 'success');
      state._cashDropCount = {}; go('sale');
    }});
  });
}

        <div class="stat-strip">
          <div class="s"><div class="l">Status</div><div class="v">${state.forceOffline ? 'Offline' : 'Online'}</div><div class="d">${state.forceOffline ? 'Queueing locally' : 'Live sync'}</div></div>
          <div class="s"><div class="l">Queued</div><div class="v">${queue.length}</div><div class="d">transactions pending</div></div>
          <div class="s"><div class="l">Queue value</div><div class="v">${money(queue.reduce((s,q)=>s+q.total,0))}</div><div class="d">total to sync</div></div>
          <div class="s"><div class="l">Last sync</div><div class="v">${queue.length === 0 ? 'Now' : '—'}</div><div class="d">${queue.length === 0 ? 'Everything synced' : 'Pending'}</div></div>
        </div>
        ${queue.length === 0 ? `
          <div class="audit-empty">
            <div style="font-size: 30px; color: var(--text-subtle); margin-bottom: 8px;"><span data-icon="check" data-icon-size="30"></span></div>
            No pending transactions. Toggle <em>Force offline</em> above to test the offline flow.
          </div>
        ` : `
          <div class="audit-log">
            ${queue.map((q, i) => `
              <div class="row">
                <span class="ts">${q.ts.slice(11, 19)}</span>
                <span class="typ sale">queued</span>
                <div>
                  <div class="nm">${q.id} · ${q.lineCount} lines · ${methodLabel(q.method)}</div>
                  <div class="meta">Will sync as soon as connectivity returns</div>
                </div>
                <span class="v">${money(q.total)}</span>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    </div>
  `;
}
function wireOfflineQueue() {
  const ob = $('#ob-queue'); if (ob) ob.addEventListener('click', () => go('offline-queue'));
  const tg = $('#oq-toggle'); if (tg) tg.addEventListener('click', () => {
    state.forceOffline = !state.forceOffline;
    logAudit('shift', state.forceOffline ? 'Forced offline' : 'Back online');
    toast(state.forceOffline ? 'Now offline — sales will queue' : 'Back online — syncing queue', state.forceOffline ? 'warn' : 'success');
    if (!state.forceOffline && state.pendingQueue.length > 0) {
      setTimeout(() => {
        const n = state.pendingQueue.length;
        state.pendingQueue = [];
        logAudit('shift', `Synced ${n} queued transactions`);
        toast(`${n} queued transactions synced`, 'success');
        render();
      }, 900);
    }
    render();
  });
  const sn = $('#oq-sync'); if (sn) sn.addEventListener('click', () => {
    if (state.forceOffline) { toast('Cannot sync while offline', 'warn'); return; }
    const n = state.pendingQueue.length;
    state.pendingQueue = [];
    logAudit('shift', `Manual sync · ${n} transactions`);
    toast(`${n} transactions synced`, 'success'); render();
  });
}

function renderSettingsTab(tab) {

  if (tab === 'data') return `

      <p class="sb">This portal stores everything in the browser. No network. No backend.</p>
      <div class="sg-row"><div><div class="lbl">Cart items</div><div class="desc">In-progress sale.</div></div><span class="tone-badge muted">${state.cart.lines.length} lines</span></div>
      <div class="sg-row"><div><div class="lbl">Parked sales</div><div class="desc">Carts paused for later.</div></div><span class="tone-badge muted">${state.parkedSales.length} parked</span></div>

      <div class="danger-row"><button id="reset-demo-2">Reset entire demo</button></div>
    </div>
  `;
  return '';
}
function wireSettings() {
  $$('[data-st]').forEach(b => b.addEventListener('click', () => { state.settingsTab = b.dataset.st; render(); }));
  $$('[data-set]').forEach(i => i.addEventListener('input', (e) => {
    state.settings[i.dataset.set] = e.target.value;
    saveState();
  }));
  $$('[data-set-num]').forEach(i => i.addEventListener('input', (e) => {
    state.settings[i.dataset.setNum] = +e.target.value || 0;
    saveState();
  }));
  $$('[data-set-tog]').forEach(b => b.addEventListener('click', () => {
    state.settings[b.dataset.setTog] = !state.settings[b.dataset.setTog];
    render();
  }));
  const tp = $('#test-print'); if (tp) tp.addEventListener('click', () => toast(`Sent test page to ${state.settings.printerName}`, 'success'));
  const rs = $('#reset-sup'); if (rs) rs.addEventListener('click', () => {
    state.settings.supervisorPin = '4321'; toast('Supervisor PIN reset', 'success'); render();
  });
  const rd = $('#reset-demo-2'); if (rd) rd.addEventListener('click', confirmReset);
}

function wireHelp() { /* no-op */ }

function wireRoute() {
  $$('[data-go]').forEach(b => {
    if (!b._goWired) { b.addEventListener('click', (e) => { e.preventDefault(); go(b.dataset.go); }); b._goWired = true; }
  });
  const fs = $('#fs-toggle'); if (fs) fs.addEventListener('click', toggleFullscreen);
  const tt = $('#theme-toggle'); if (tt) tt.addEventListener('click', toggleTheme);
  switch (state.route) {
    case 'open-till':    wireOpenTill(); break;
    case 'sale':         wireSale(); break;
    case 'tender':       wireTender(); break;
    case 'receipt':      wireReceipt(); break;
    case 'refund':       wireRefund(); break;
    case 'void-receipt': wireVoidReceipt(); break;
    case 'customer':     wireCustomer(); break;
    case 'item':         wireItem(); break;
    case 'parked':       wireParked(); break;
    case 'cash-drop':    wireCashDrop(); break;
    case 'cashup':       wireCashup(); break;
    case 'z-report':     wireZReport(); break;
    case 'my-reports':   wireMyReports(); break;
    case 'audit':        wireAudit(); break;
    case 'offline-queue':wireOfflineQueue(); break;
    case 'settings':     wireSettings(); break;
    case 'help':         wireHelp(); break;
  }
  // Offline-banner queue button is in the shell, not the route
  const ob = $('#ob-queue'); if (ob && !ob._wired) { ob._wired = true; ob.addEventListener('click', () => go('offline-queue')); }
}

/* === Init === */
function init() {
  // Honor ?fullscreen=1 query param
  if (/[?&]fullscreen=1/.test(location.search)) {
    document.body.classList.add('is-fullscreen');
  }
  // Load any persisted state, then apply theme before first paint
  loadState();
  applyTheme(state.theme || 'light');
  const r = (location.hash.replace(/^#\/?/, '') || 'sale');
  state.route = r;
  // Pre-seed cart with a starter so the demo isn't empty
  if (r === 'sale' && state.cart.lines.length === 0) {
    addToCart('I-001');
    addToCart('I-006');
    addToCart('I-012');
    addToCart('I-012');
    state.cart.customerId = 'C-001';
  }
  render();
}

if (document.readyState !== 'loading') init();
else document.addEventListener('DOMContentLoaded', init);
</script>
