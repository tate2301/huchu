<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>POS demo · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../shared.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
<style>
  body { background: var(--canvas); margin: 0; transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out); }

  /* === Dark theme — the full token cascade lives in tokens.css (body.is-dark).
       Only POS-specific component overrides remain below. === */
  body.is-dark .sale .tile.bev .sw { background: linear-gradient(135deg, rgba(220,238,255,0.16), rgba(111,160,255,0.32)); color: #BFD5FF; }
  body.is-dark .sale .tile.gro .sw { background: linear-gradient(135deg, rgba(254,244,218,0.12), rgba(244,193,91,0.28)); color: #F4D38A; }
  body.is-dark .sale .tile.tob .sw { background: linear-gradient(135deg, rgba(252,231,243,0.12), rgba(236,72,153,0.28)); color: #F4A5C9; }
  body.is-dark .sale .tile.cln .sw { background: linear-gradient(135deg, rgba(220,252,231,0.12), rgba(74,222,128,0.26)); color: #9CDAB4; }
  body.is-dark .sale .tile.bak .sw { background: linear-gradient(135deg, rgba(255,229,200,0.12), rgba(226,164,88,0.28)); color: #E8C28A; }
  body.is-dark .sale .tile.snk .sw { background: linear-gradient(135deg, rgba(237,224,255,0.12), rgba(167,139,250,0.30)); color: #C6B3FF; }

  /* Dark-mode modal scrim is slightly lighter (background is already dark) */
  body.is-dark .modal-scrim { background: rgba(0,0,0,0.70); }
  body.is-dark .cart-sheet-scrim { background: rgba(0,0,0,0.65); }
  body.is-dark .toast { background: #2A2F3D; color: #F5F7FB; box-shadow: 0 8px 24px -6px rgba(0,0,0,0.6); }
  body.is-dark .toast.success { background: var(--tone-success); color: #0F1115; }
  body.is-dark .toast.danger { background: var(--tone-danger); color: #0F1115; }
  body.is-dark .toast.warn { background: var(--tone-warn); color: #0F1115; }

  /* === App shell === */
  .pd-app {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 52px 1fr;
    grid-template-areas: "side bar" "side main";
    height: calc(100vh - 47px); /* minus pk-nav */
    min-height: 640px;
    background: var(--canvas);
  }
  .pd-bar { grid-area: bar; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 18px; font: 500 13px/1 var(--font-sans); color: var(--text-strong); }
  .pd-bar .br { font-weight: 600; }
  .pd-bar .sep { color: var(--text-subtle); }
  .pd-bar .pill { padding: 4px 10px; border-radius: 9999px; font: 500 11.5px/1 var(--font-sans); background: var(--surface-muted); color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; }
  .pd-bar .pill.live { background: var(--tone-success-bg); color: var(--tone-success); }
  .pd-bar .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pd-bar .spacer { flex: 1; }
  .pd-bar .cashier { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); }
  .pd-bar .cashier .av { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 11px/1 var(--font-sans); }

  .pd-bar .bar-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 7px;
    background: var(--surface-muted); color: var(--text-strong);
    border: 0; cursor: pointer;
    font: 500 12px/1 var(--font-sans);
  }
  .pd-bar .bar-btn:hover { background: var(--surface-sunken); }
  .pd-bar .bar-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* === Fullscreen preview mode === */
  body.is-fullscreen .pk-nav { display: none !important; }
  body.is-fullscreen { background: var(--ink); }
  body.is-fullscreen .pd-app {
    height: 100vh; height: 100dvh;
  }

  .pd-side { grid-area: side; background: var(--ink); color: rgba(255,255,255,0.85); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pd-side .pd-brand { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font: 600 14px/1 var(--font-sans); color: #fff; }
  .pd-side .pd-brand .m { color: #fff; }
  .pd-side .pd-h { font: 500 10.5px/1 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.35); padding: 14px 10px 6px; }
  .pd-nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 10px; border-radius: 7px;
    color: rgba(255,255,255,0.78); text-decoration: none;
    font: 500 13px/1 var(--font-sans);
    border: 0; background: transparent; cursor: pointer; width: 100%; text-align: left;
  }
  .pd-nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .pd-nav-item.active { background: var(--brand); color: #fff; }
  .pd-nav-item .ic { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: currentColor; flex: none; }
  .pd-nav-item .tag { margin-left: auto; padding: 1px 6px; border-radius: 9999px; background: rgba(255,255,255,0.12); font: 600 10px/1 var(--font-mono); color: #fff; }
  .pd-side .pd-foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid rgba(255,255,255,0.08); font: 11.5px/1.4 var(--font-sans); color: rgba(255,255,255,0.5); }
  .pd-side .pd-foot strong { color: rgba(255,255,255,0.85); font-weight: 600; display: block; }

  .pd-main { grid-area: main; min-width: 0; min-height: 0; overflow: hidden; display: flex; }

  /* === Sale screen === */
  .sale {
    display: grid;
    grid-template-columns: 1fr 360px;
    width: 100%; min-width: 0;
  }
  .sale .cat { display: flex; flex-direction: column; min-width: 0; }
  .sale .cat-bar { padding: 14px 18px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .sale .cat-bar .srch { flex: 1; position: relative; }
  .sale .cat-bar .srch input { width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--canvas); font: 400 14px/1 var(--font-sans); color: var(--text-body); }
  .sale .cat-bar .srch input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .sale .cat-bar .srch [data-icon] { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-subtle); }
  .sale .cat-bar .scan { width: 36px; height: 36px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; border: 1px solid var(--border); cursor: pointer; }
  .sale .cat-bar .scan:hover { background: var(--surface-sunken); }

  /* Sale uses .b-filter-chips — sit it on the cat-bar surface, no extra padding-top */
  .sale .b-filter-chips { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 18px; }

  .sale .grid {
    flex: 1; overflow-y: auto;
    padding: 14px 18px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px; align-content: start;
  }
  .sale .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; display: flex; flex-direction: column; gap: 6px;
    text-align: left; cursor: pointer; transition: all 100ms ease;
    position: relative;
  }
  .sale .tile:hover { border-color: var(--brand-200); transform: translateY(-1px); box-shadow: 0 4px 12px -4px rgba(11,93,240,0.18); }
  .sale .tile:active { transform: translateY(0); }
  .sale .tile .sw { height: 70px; border-radius: 6px; background: var(--surface-muted); display: grid; place-items: center; color: var(--text-strong); font: 700 22px/1 var(--font-sans); }
  .sale .tile.bev .sw { background: linear-gradient(135deg, #DCEEFF, #6FA0FF); color: #1E3A8A; }
  .sale .tile.gro .sw { background: linear-gradient(135deg, #FEF4DA, #F4C15B); color: #6B5119; }
  .sale .tile.tob .sw { background: linear-gradient(135deg, #FCE7F3, #EC4899); color: #831843; }
  .sale .tile.cln .sw { background: linear-gradient(135deg, #DCFCE7, #4ADE80); color: #166534; }
  .sale .tile.bak .sw { background: linear-gradient(135deg, #FFE5C8, #E2A458); color: #6B3F19; }
  .sale .tile.snk .sw { background: linear-gradient(135deg, #EDE0FF, #A78BFA); color: #4C1D95; }
  .sale .tile .nm { font: 500 12.5px/1.25 var(--font-sans); color: var(--text-strong); }
  .sale .tile .pr { font: 600 12.5px/1 var(--font-mono); color: var(--text-strong); margin-top: auto; font-variant-numeric: tabular-nums; }
  .sale .tile .stk { position: absolute; top: 6px; right: 6px; padding: 1px 6px; border-radius: 9999px; background: var(--surface-muted); font: 500 9px/1 var(--font-mono); color: var(--text-muted); }
  .sale .tile.low .stk { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .sale .tile.oos { opacity: 0.55; cursor: not-allowed; }
  .sale .tile.oos .stk { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .sale .tile.added { animation: tilePulse 350ms ease; }
  @keyframes tilePulse {
    0% { background: var(--brand-50); border-color: var(--brand); }
    100% { background: var(--surface); border-color: var(--border); }
  }

  /* Cart side */
  .cart { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
  .cart .ch { padding: 14px 16px 10px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; gap: 10px; }
  .cart .ch h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0; flex: 1; }
  .cart .ch .cnt { font: 500 11.5px/1 var(--font-mono); color: var(--text-muted); padding: 3px 8px; border-radius: 9999px; background: var(--surface-muted); }
  .cart .ch button { width: 28px; height: 28px; border-radius: 6px; background: transparent; color: var(--text-muted); display: grid; place-items: center; cursor: pointer; }
  .cart .ch button:hover { background: var(--surface-muted); color: var(--text-strong); }

  .cart .cust {
    padding: 8px 16px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
  }
  .cart .cust:hover { background: var(--surface-muted); }
  .cart .cust .av { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; font: 600 11px/1 var(--font-sans); flex: none; }
  .cart .cust .av.b { background: var(--brand-soft); color: var(--brand-strong); }
  .cart .cust .nm { font: 500 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .cart .cust .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); }
  .cart .cust .ar { margin-left: auto; color: var(--text-subtle); }

  .cart .lines { flex: 1; overflow-y: auto; padding: 6px 0; min-height: 0; }
  .cart .empty { padding: 60px 24px; text-align: center; color: var(--text-muted); font: 13px/1.5 var(--font-sans); }
  .cart .empty .lg { font-size: 32px; margin-bottom: 12px; color: var(--text-subtle); }
  .cart .line { padding: 9px 16px; border-bottom: 1px solid var(--border-subtle); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
  .cart .line.voided { opacity: 0.45; }
  .cart .line.voided .nm { text-decoration: line-through; }
  .cart .line .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .cart .line .total { font: 600 13.5px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; align-self: center; }
  .cart .line .meta { font: 11.5px/1.3 var(--font-mono); color: var(--text-muted); grid-column: 1; display: inline-flex; gap: 6px; align-items: center; }
  .cart .line .ctrl { grid-column: 2; display: inline-flex; gap: 4px; align-items: center; }
  .cart .line .ctrl button { width: 22px; height: 22px; border-radius: 5px; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; font: 600 13px/1 var(--font-mono); cursor: pointer; }
  .cart .line .ctrl button:hover { background: var(--surface-sunken); }
  .cart .line .ctrl .q { padding: 0 6px; font: 500 12px/1 var(--font-mono); color: var(--text-strong); min-width: 16px; text-align: center; }
  .cart .line .more { color: var(--text-subtle); width: 22px; height: 22px; display: grid; place-items: center; cursor: pointer; border-radius: 5px; }
  .cart .line .more:hover { background: var(--surface-muted); color: var(--text-strong); }

  .cart .disc { padding: 10px 16px; background: var(--brand-soft); border-top: 1px solid var(--brand-100); display: flex; align-items: center; gap: 8px; color: var(--brand-strong); font: 500 12.5px/1 var(--font-sans); }
  .cart .disc .v { margin-left: auto; font: 600 13px/1 var(--font-mono); }
  .cart .disc button { color: var(--brand-strong); background: transparent; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
  .cart .disc button:hover { background: rgba(11,93,240,0.12); }

  .cart .totals { padding: 12px 16px 6px; border-top: 1px solid var(--border-subtle); }
  .cart .tr { display: flex; justify-content: space-between; padding: 3px 0; font: 13px/1.4 var(--font-sans); color: var(--text-muted); }
  .cart .tr .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-body); }
  .cart .tr.gr { font: 700 18px/1.2 var(--font-sans); color: var(--text-strong); padding-top: 6px; border-top: 1px solid var(--border-subtle); margin-top: 6px; }
  .cart .tr.gr .v { font: 700 18px/1 var(--font-mono); color: var(--text-strong); }

  .cart .acts { padding: 10px 14px 8px; display: flex; gap: 6px; }
  .cart .acts button { flex: 1; padding: 8px; border-radius: 7px; background: var(--surface-muted); color: var(--text-body); font: 500 12px/1.3 var(--font-sans); display: inline-flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
  .cart .acts button:hover { background: var(--surface-sunken); color: var(--text-strong); }
  .cart .acts button:disabled { opacity: 0.45; cursor: not-allowed; }

  .cart .charge {
    margin: 0 14px 14px;
    padding: 16px;
    background: var(--brand); color: #fff;
    border-radius: 10px;
    font: 700 17px/1 var(--font-sans);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    cursor: pointer; transition: background 120ms;
  }
  .cart .charge:hover:not(:disabled) { background: var(--brand-strong); }
  .cart .charge:disabled { background: var(--surface-muted); color: var(--text-muted); cursor: not-allowed; }
  .cart .charge .v { font: 700 19px/1 var(--font-mono); font-variant-numeric: tabular-nums; }

  /* === Tender === */
  .tender { width: 100%; padding: 28px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; min-height: 0; }
  .tender-wrap { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .tender .due {
    grid-column: 1 / -1;
    background:
      radial-gradient(70% 140% at 80% 0%, var(--brand-soft) 0%, transparent 65%),
      var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 24px; text-align: center;
    position: relative;
  }
  .tender .due .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 9999px; background: var(--brand-soft); color: var(--brand-strong); }
  .tender .due .am { font: 700 56px/1 var(--font-sans); letter-spacing: -0.025em; color: var(--text-strong); margin: 14px 0 4px; font-variant-numeric: tabular-nums; }
  .tender .due .am .c { font-size: 28px; color: var(--text-muted); font-weight: 500; margin-right: 4px; vertical-align: top; }
  .tender .due .lines-info { font: 13.5px/1.4 var(--font-sans); color: var(--text-muted); }

  .tender .methods { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .tender .methods h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 14px; }
  .tender .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tender .mbtn {
    padding: 18px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); cursor: pointer;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    transition: all 100ms;
  }
  .tender .mbtn:hover { border-color: var(--brand-200); background: var(--brand-50); }
  .tender .mbtn.on { border-color: var(--brand); background: var(--brand-soft); }
  .tender .mbtn .ic-tile { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; }
  .tender .mbtn .nm { font: 600 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .tender .mbtn .sb { font: 12px/1.3 var(--font-sans); color: var(--text-muted); }

  .tender .work { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .tender .work h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0; }
  .tender .recv {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .tender .recv .cell { padding: 10px 12px; background: var(--surface-muted); border-radius: 8px; }
  .tender .recv .cell .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
  .tender .recv .cell .v { font: 600 18px/1 var(--font-mono); color: var(--text-strong); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tender .recv .cell.due { background: var(--brand-soft); color: var(--brand-strong); }
  .tender .recv .cell.due .lbl, .tender .recv .cell.due .v { color: var(--brand-strong); }
  .tender .recv .cell.chg { background: var(--tone-success-bg); color: var(--tone-success); }
  .tender .recv .cell.chg .lbl, .tender .recv .cell.chg .v { color: var(--tone-success); }
  .tender .recv .cell.short { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .tender .recv .cell.short .lbl, .tender .recv .cell.short .v { color: var(--tone-danger); }
  .tender .quicks { display: flex; gap: 6px; flex-wrap: wrap; }
  .tender .quicks .q { padding: 8px 12px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); cursor: pointer; font: 500 13px/1 var(--font-sans); }
  .tender .quicks .q:hover { background: var(--surface-sunken); }
  .tender .quicks .q.exact { background: var(--brand-soft); color: var(--brand-strong); }
  .tender .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tender .keypad button { height: 44px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); font: 600 16px/1 var(--font-sans); cursor: pointer; }
  .tender .keypad button:hover { background: var(--surface-sunken); }
  .tender .keypad button.fn { background: var(--ink); color: #fff; }
  .tender .keypad button.fn:hover { background: var(--ink-2); }
  .tender .sim { padding: 14px; border: 1px dashed var(--border-strong); border-radius: 10px; text-align: center; color: var(--text-muted); font: 13px/1.5 var(--font-sans); }
  .tender .sim strong { color: var(--text-strong); display: block; font-size: 15px; margin-bottom: 4px; }
  .tender .sim .pulse { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); margin-right: 6px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; transform: scale(1.3); } }

  .tender .confirm {
    grid-column: 1 / -1;
    display: flex; gap: 8px;
  }
  .tender .confirm button { flex: 1; padding: 14px; border-radius: 10px; cursor: pointer; font: 600 14px/1 var(--font-sans); }
  .tender .confirm .ok { background: var(--brand); color: #fff; }
  .tender .confirm .ok:hover:not(:disabled) { background: var(--brand-strong); }
  .tender .confirm .ok:disabled { opacity: 0.5; cursor: not-allowed; }
  .tender .confirm .cancel { background: var(--surface-muted); color: var(--text-body); }
  .tender .confirm .cancel:hover { background: var(--surface-sunken); color: var(--text-strong); }

  /* === Receipt screen === */
  .receipt-page { width: 100%; padding: 28px; overflow-y: auto; display: grid; place-items: center; }
  .receipt-card {
    width: 100%; max-width: 480px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px;
  }
  .receipt-card .succ { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--tone-success-bg); border-radius: 10px; margin-bottom: 20px; }
  .receipt-card .succ .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--tone-success); color: #fff; display: grid; place-items: center; flex: none; animation: pop 320ms ease; }
  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .receipt-card .succ .nm { font: 600 15px/1.2 var(--font-sans); color: var(--tone-success); }
  .receipt-card .succ .sb { font: 12.5px/1.3 var(--font-sans); color: var(--tone-success); opacity: 0.85; margin-top: 2px; }
  .receipt-card h2 { font: 600 18px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 4px; text-align: center; }
  .receipt-card .meta-row { text-align: center; font: 12.5px/1.5 var(--font-sans); color: var(--text-muted); margin-bottom: 18px; }
  .receipt-card .rl { display: flex; justify-content: space-between; font: 13px/1.5 var(--font-sans); padding: 4px 0; }
  .receipt-card .rl .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .receipt-card .rl.head { font-weight: 600; color: var(--text-strong); border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 4px; }
  .receipt-card .rl.foot { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 8px; font-weight: 700; font-size: 15px; color: var(--text-strong); }
  .receipt-card .rl.foot .v { font-size: 16px; }
  .receipt-card .acts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 22px; }
  .receipt-card .acts .btn { padding: 12px; border-radius: 8px; font: 500 13px/1 var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .receipt-card .acts .btn.primary { background: var(--brand); color: #fff; grid-column: 1 / -1; padding: 14px; font-weight: 600; font-size: 14px; }
  .receipt-card .acts .btn.primary:hover { background: var(--brand-strong); }
  .receipt-card .acts .btn.alt { background: var(--surface-muted); color: var(--text-strong); }
  .receipt-card .acts .btn.alt:hover { background: var(--surface-sunken); }

  /* === Generic list pages (refund, customer, item) === */
  .page { width: 100%; padding: 22px; overflow-y: auto; min-width: 0; }
  .page-h { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
  .page-h h2 { font: 700 22px/1.2 var(--font-sans); letter-spacing: -0.015em; color: var(--text-strong); margin: 0; }
  .page-h .lede { font: 14px/1.55 var(--font-sans); color: var(--text-muted); margin: 4px 0 0; }

  .splitp { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
  .splitp .pane { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .splitp .pane .h { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 12px; }
  .splitp .pane .empty { padding: 32px 12px; text-align: center; color: var(--text-muted); font: 13px/1.5 var(--font-sans); }

  .input { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 36px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font: 14px var(--font-sans); }
  .input input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; color: var(--text-body); padding: 0; }
  .input [data-icon] { color: var(--text-subtle); }
  .input:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }

  .list-rows .lr { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; align-items: center; }
  .list-rows .lr:hover { background: var(--surface-muted); }
  .list-rows .lr.on { background: var(--brand-soft); }
  .list-rows .lr.on .nm { color: var(--brand-strong); }
  .list-rows .lr .av { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; font: 600 12px/1 var(--font-sans); }
  .list-rows .lr.on .av { background: var(--brand); color: #fff; }
  .list-rows .lr .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .list-rows .lr .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .list-rows .lr .vl { font: 500 13px/1 var(--font-mono); color: var(--text-muted); }

  /* Refund-specific */
  .refund-pane .receipt-lines { margin: 12px 0; }
  .refund-pane .rln { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 10px 8px; border-bottom: 1px solid var(--border-subtle); align-items: center; }
  .refund-pane .rln:last-child { border-bottom: 0; }
  .refund-pane .rln input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .refund-pane .rln .nm { font: 500 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .refund-pane .rln .sb { font: 11px/1.3 var(--font-mono); color: var(--text-muted); margin-top: 2px; }
  .refund-pane .rln .v { font: 500 13px/1 var(--font-mono); color: var(--text-strong); }
  /* Reason chips use .b-filter-chips — flush so they sit cleanly in the pane */
  .refund-pane .b-filter-chips { padding: 4px 0 12px; flex-wrap: wrap; }
  .refund-pane .total-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-top: 1px dashed var(--border); margin-top: 8px; }
  .refund-pane .total-bar .lbl { font: 500 12px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .refund-pane .total-bar .v { font: 700 20px/1 var(--font-mono); color: var(--tone-danger); font-variant-numeric: tabular-nums; }

  /* Customer profile pane */
  .cust-prof { padding: 12px; }
  .cust-prof .hero { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .cust-prof .hero .av { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 17px/1 var(--font-sans); }
  .cust-prof .hero h3 { font: 600 16px/1.2 var(--font-sans); color: var(--text-strong); margin: 0; }
  .cust-prof .hero .sb { font: 12.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .cust-prof .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .cust-prof .stat { padding: 10px; background: var(--surface-muted); border-radius: 8px; text-align: center; }
  .cust-prof .stat .v { font: 600 15px/1 var(--font-sans); color: var(--text-strong); }
  .cust-prof .stat .l { font: 11px/1 var(--font-sans); color: var(--text-muted); margin-top: 4px; letter-spacing: 0.04em; }
  .cust-prof .stat.brand .v { color: var(--brand-strong); }

  /* === Cash-up === */
  .cashup { width: 100%; padding: 22px; overflow-y: auto; }
  .cashup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; }
  .cashup .pane { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .cashup .pane h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; }
  .cashup .ex-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); font: 13.5px/1.4 var(--font-sans); }
  .cashup .ex-row:last-of-type { border-bottom: 0; }
  .cashup .ex-row .v { font: 500 14px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .cashup .ex-row.total { padding-top: 14px; border-top: 2px solid var(--border); margin-top: 6px; font: 600 14.5px/1 var(--font-sans); }
  .cashup .ex-row.total .v { font-size: 16px; }

  .cashup .den { display: grid; grid-template-columns: 80px 1fr 90px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
  .cashup .den .dn { font: 600 13px/1 var(--font-mono); color: var(--text-strong); }
  .cashup .den .ctrl { display: flex; align-items: center; gap: 4px; justify-content: center; }
  .cashup .den .ctrl button { width: 30px; height: 28px; border-radius: 6px; background: var(--surface-muted); cursor: pointer; font: 600 14px/1 var(--font-mono); color: var(--text-strong); }
  .cashup .den .ctrl button:hover { background: var(--surface-sunken); }
  .cashup .den .ctrl input { width: 50px; height: 28px; padding: 0 6px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font: 500 13px var(--font-mono); }
  .cashup .den .ln { text-align: right; font: 500 13.5px/1 var(--font-mono); color: var(--text-strong); }

  .cashup .variance { grid-column: 1 / -1; padding: 16px 20px; border-radius: 12px; display: flex; align-items: center; gap: 14px; }
  .cashup .variance.ok { background: var(--tone-success-bg); color: var(--tone-success); }
  .cashup .variance.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .cashup .variance.bad { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .cashup .variance .ic { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.6); display: grid; place-items: center; flex: none; }
  .cashup .variance .ttl { font: 600 15px/1.3 var(--font-sans); }
  .cashup .variance .sb { font: 13px/1.4 var(--font-sans); opacity: 0.85; margin-top: 2px; }
  .cashup .variance .v { margin-left: auto; font: 700 22px/1 var(--font-mono); }
  .cashup .submit { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
  .cashup .submit button { padding: 12px 20px; border-radius: 8px; font: 600 14px/1 var(--font-sans); cursor: pointer; }
  .cashup .submit .ok { background: var(--brand); color: #fff; }
  .cashup .submit .ok:hover { background: var(--brand-strong); }
  .cashup .submit .alt { background: var(--surface-muted); color: var(--text-strong); }

  /* === Z-report === */
  .zrep { width: 100%; padding: 22px; overflow-y: auto; }
  .zrep-card { max-width: 1000px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
  .zrep h2 { font: 700 22px/1 var(--font-sans); color: var(--text-strong); margin: 0; }
  .zrep .sub { font: 13.5px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 4px; }
  .zrep .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
  .zrep .k { padding: 14px; background: var(--surface-muted); border-radius: 10px; }
  .zrep .k.brand { background: var(--brand); color: #fff; }
  .zrep .k .l { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
  .zrep .k.brand .l { color: rgba(255,255,255,0.7); }
  .zrep .k .v { font: 700 22px/1.1 var(--font-mono); margin-top: 8px; font-variant-numeric: tabular-nums; color: var(--text-strong); }
  .zrep .k.brand .v { color: #fff; }
  .zrep .sec { margin-top: 22px; }
  .zrep .sec h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .zrep .sec h3 .meta { font: 11px/1 var(--font-mono); color: var(--text-muted); }
  .zrep .tbl { width: 100%; border-collapse: collapse; font: 13px var(--font-sans); }
  .zrep .tbl th, .zrep .tbl td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
  .zrep .tbl th { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); background: var(--surface-muted); }
  .zrep .tbl td.num, .zrep .tbl th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .zrep .tbl tr:last-child td { border-bottom: 0; }
  .zrep .ftr { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; }
  .zrep .ftr button { padding: 10px 16px; border-radius: 7px; font: 500 13px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .zrep .ftr .alt { background: var(--surface-muted); color: var(--text-strong); }
  .zrep .ftr .pri { background: var(--brand); color: #fff; }
  .zrep .ftr .pri:hover { background: var(--brand-strong); }

  /* === Modals === */
  .modal-scrim {
    position: fixed; inset: 0; background: rgba(22,24,29,0.6);
    z-index: 100; display: grid; place-items: center; padding: 20px;
    animation: scrimIn 160ms ease;
  }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface); border-radius: 14px; padding: 22px;
    width: 100%; max-width: 360px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4);
    animation: modalIn 220ms cubic-bezier(0.2, 0, 0.1, 1);
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal h3 { font: 600 16px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 4px; }
  .modal .sub { font: 13px/1.4 var(--font-sans); color: var(--text-muted); margin: 0 0 14px; }
  .modal .otp { display: flex; gap: 8px; justify-content: center; margin: 14px 0 16px; }
  .modal .otp input[aria-invalid="true"] { border-color: var(--tone-danger); color: var(--tone-danger); animation: shake 350ms; }
  @keyframes shake { 25%, 75% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
  .modal .pin-err { color: var(--tone-danger); font: 500 12px/1.4 var(--font-sans); text-align: center; margin-top: 6px; }

  .modal .row { display: flex; gap: 6px; margin-bottom: 12px; }
  .modal .row input { flex: 1; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; font: 500 14px var(--font-sans); }
  .modal .row input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .modal .seg { display: inline-flex; padding: 2px; background: var(--surface-muted); border-radius: 7px; }
  .modal .seg button { padding: 6px 12px; border-radius: 5px; font: 500 12px var(--font-sans); color: var(--text-muted); background: transparent; cursor: pointer; }
  .modal .seg button.on { background: var(--surface); color: var(--text-strong); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .modal .acts { display: flex; gap: 6px; margin-top: 14px; }
  .modal .acts button { flex: 1; padding: 11px; border-radius: 8px; font: 600 13px var(--font-sans); cursor: pointer; }
  .modal .acts .ok { background: var(--brand); color: #fff; }
  .modal .acts .ok:hover { background: var(--brand-strong); }
  .modal .acts .alt { background: var(--surface-muted); color: var(--text-strong); }

  /* === Toast === */
  .toast-host { position: fixed; top: 78px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    background: var(--ink); color: #fff; padding: 11px 16px;
    border-radius: 8px; font: 500 13.5px/1.4 var(--font-sans);
    box-shadow: 0 8px 20px -6px rgba(0,0,0,0.3);
    display: inline-flex; align-items: center; gap: 8px;
    animation: toastIn 240ms ease; pointer-events: auto;
  }
  .toast.success { background: var(--tone-success); }
  .toast.danger { background: var(--tone-danger); }
  .toast.warn { background: var(--tone-warn); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  .toast.out { animation: toastOut 240ms ease forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translateX(20px); } }

  /* Hidden by default (only used in mobile drill-in) */
  .back-list {
    display: none;
    align-items: center; gap: 6px;
    padding: 7px 10px; margin: -4px -4px 10px;
    background: var(--surface-muted); border-radius: 6px;
    font: 500 12.5px/1 var(--font-sans); color: var(--brand-strong);
    cursor: pointer; border: 0; width: fit-content;
  }

  /* === Mobile cart sheet === */
  .cart-sheet-scrim {
    display: none;
    position: fixed; inset: 0; background: rgba(22,24,29,0.55);
    z-index: 60; animation: scrimIn 160ms ease;
  }
  .cart-sheet-scrim.open { display: block; }

  /* === Mobile "view cart" sticky bar === */
  .view-cart-bar { display: none; }

  /* === Responsive === */
  @media (max-width: 1000px) {
    .pd-app { grid-template-columns: 64px 1fr; }
    .pd-side .pd-h, .pd-side .pd-foot, .pd-nav-item span:not(.ic):not(.tag) { display: none; }
    .pd-nav-item { justify-content: center; padding: 9px; }
    .pd-side .pd-brand { justify-content: center; }
    .pd-side .pd-brand > span:last-child { display: none; }
    .pd-nav-item .tag { display: none; }
    .sale { grid-template-columns: 1fr 320px; }
    .tender-wrap { grid-template-columns: 1fr; }
    .splitp { grid-template-columns: 1fr; }
    .cashup-grid { grid-template-columns: 1fr; }
    .zrep .kpis { grid-template-columns: 1fr 1fr; }
  }

  /* Phone */
  @media (max-width: 720px) {
    .pd-app {
      grid-template-columns: 1fr;
      grid-template-rows: 44px 1fr;
      grid-template-areas: "bar" "main";
      height: calc(100dvh - 47px); /* minus pk-nav */
      min-height: 0;
    }
    /* Leave room for the fixed .b-bottom-tabs so the last row isn't covered. */
    .pd-main { padding-bottom: calc(64px + env(safe-area-inset-bottom, 8px)); }
    .pd-side { display: none; }

    /* Top bar compresses */
    .pd-bar { padding: 0 12px; gap: 6px; font-size: 12px; height: 44px; }
    .pd-bar .br { font-weight: 600; }
    .pd-bar .cashier > span:not(.av) { display: none; }
    .pd-bar .pill { padding: 3px 7px; font-size: 10.5px; }
    .pd-bar .pill > span:not(.dot) { display: none; }
    .pd-bar .cashier { gap: 4px; }
    .pd-bar > .sep { display: none; }
    .pd-bar > span:not(.br):not(.pill):not(.cashier):not(.spacer) { display: none; } /* hide "Till 02 · Shift S-2841" */
    .pd-bar .bar-btn-label { display: none; }
    .pd-bar .bar-btn { padding: 6px 8px; }

    /* Sale: full-width catalog */
    .sale {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr auto;
      position: relative;
    }
    .sale .cat-bar { padding: 10px 12px; }
    .sale .b-filter-chips { padding: 8px 12px; }
    .sale .grid {
      padding: 10px 12px 80px; /* bottom space for view-cart bar */
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .sale .tile { padding: 8px; gap: 4px; }
    .sale .tile .sw { height: 60px; font-size: 18px; }
    .sale .tile .nm { font-size: 12px; }
    .sale .tile .pr { font-size: 12px; }

    /* View cart sticky bar */
    .view-cart-bar {
      display: flex; align-items: center; gap: 10px;
      position: absolute; left: 8px; right: 8px; bottom: 8px;
      background: var(--brand); color: #fff;
      padding: 12px 14px; border-radius: 12px;
      box-shadow: 0 10px 24px -6px rgba(11,93,240,0.4);
      cursor: pointer; z-index: 5;
      animation: barIn 240ms ease;
    }
    @keyframes barIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .view-cart-bar .ic-bg { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.18); display: grid; place-items: center; flex: none; }
    .view-cart-bar .lbl { font: 600 14px/1.2 var(--font-sans); flex: 1; }
    .view-cart-bar .meta { font: 500 12px/1.2 var(--font-sans); opacity: 0.85; margin-top: 2px; }
    .view-cart-bar .v { font: 700 16px/1 var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Cart becomes a slide-up sheet covering full viewport (above tab bar) */
    .cart {
      position: fixed;
      left: 0; right: 0; top: 0; bottom: 0;
      z-index: 70;
      border-left: 0;
      border-radius: 0;
      box-shadow: 0 -20px 40px -10px rgba(0,0,0,0.25);
      transform: translateY(100%);
      transition: transform 280ms cubic-bezier(0.2, 0, 0.1, 1);
      display: flex;
    }
    .cart.open { transform: translateY(0); }
    .cart .ch { padding-top: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .cart .lines { padding: 0; }
    .cart .line { padding: 12px 16px; }
    .cart .totals { padding-top: 14px; }
    .cart .charge { margin-bottom: calc(14px + env(safe-area-inset-bottom)); padding: 18px; font-size: 18px; }
    .cart .acts button { padding: 12px; font-size: 13.5px; }
    .cart .ch #close-sheet {
      display: grid !important;
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--surface-muted);
      place-items: center;
      color: var(--text-strong); cursor: pointer;
    }

    /* Tender single column — compact for phone */
    .tender { padding: 12px 12px 80px; align-items: stretch; }
    .tender-wrap { gap: 10px; max-width: 100%; }
    .tender .due { padding: 14px; }
    .tender .due .lbl { font-size: 11px; }
    .tender .due .am { font-size: 36px; margin: 6px 0 2px; }
    .tender .due .am .c { font-size: 20px; }
    .tender .due .lines-info { font-size: 12px; }
    .tender .methods { padding: 12px; }
    .tender .methods h3 { margin-bottom: 8px; font-size: 13px; }
    /* Compact horizontal method picker on phone */
    .tender .mgrid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .tender .mbtn { padding: 10px; gap: 2px; flex-direction: row; align-items: center; }
    .tender .mbtn .ic-tile { width: 28px; height: 28px; flex: none; }
    .tender .mbtn > div, .tender .mbtn .nm, .tender .mbtn .sb { font-size: 11.5px; }
    .tender .mbtn .nm { font-size: 13px; font-weight: 600; }
    .tender .mbtn .sb { display: none; } /* drop subtitle on phone */
    /* Make split tender span full row */
    .tender .mbtn[data-m="split"] { grid-column: 1 / -1; }
    .tender .work { padding: 12px; gap: 10px; }
    .tender .recv { gap: 6px; }
    .tender .recv .cell { padding: 8px 10px; }
    .tender .recv .cell .v { font-size: 16px; margin-top: 4px; }
    .tender .quicks { gap: 4px; }
    .tender .quicks .q { padding: 7px 10px; font-size: 12.5px; }
    .tender .keypad { gap: 5px; }
    .tender .keypad button { height: 44px; font-size: 16px; }
    /* Confirm bar: sticky at bottom so it's always reachable */
    .tender .confirm {
      position: sticky; bottom: 0;
      flex-direction: row; gap: 6px;
      padding: 10px 12px;
      margin: 0 -12px -12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      grid-column: 1 / -1;
      z-index: 5;
    }
    .tender .confirm button { padding: 12px; font-size: 13.5px; flex: 1; }
    .tender .confirm .cancel { flex: 0 0 auto; padding: 12px 14px; }
    .tender .confirm .cancel { font-size: 12.5px; }
    .tender .sim { padding: 12px; font-size: 12.5px; }

    /* Receipt page */
    .receipt-page { padding: 14px; }
    .receipt-card { padding: 20px 16px; }
    .receipt-card h2 { font-size: 16px; }
    .receipt-card .acts { grid-template-columns: 1fr 1fr; gap: 6px; }
    .receipt-card .acts .btn.primary { grid-column: 1 / -1; padding: 13px; }

    /* Generic pages */
    .page { padding: 14px; }
    .page-h { gap: 10px; margin-bottom: 12px; }
    .page-h h2 { font-size: 19px; }
    .page-h .lede { font-size: 13px; }
    .splitp { gap: 10px; }
    .splitp .pane { padding: 12px; }

    /* Customer/refund/item: stack with drill-in navigation */
    .splitp.has-detail { grid-template-rows: auto; }
    /* When a row is selected, hide the list (drill-in style) */
    .splitp.has-selection > .pane:first-child { display: none; }
    .splitp.has-selection .back-list {
      display: flex !important;
    }
    .splitp.has-detail .back-list { display: none; }

    /* Cash-up: tighter */
    .cashup { padding: 14px; }
    .cashup .pane { padding: 14px; }
    .cashup .den { grid-template-columns: 56px 1fr 76px; gap: 6px; padding: 6px 0; }
    .cashup .den .ctrl button { width: 26px; height: 26px; }
    .cashup .den .ctrl input { width: 44px; height: 26px; }
    .cashup .den .ln { font-size: 12.5px; }
    .cashup .den .dn { font-size: 12.5px; }
    .cashup .variance { padding: 12px 14px; gap: 10px; }
    .cashup .variance .v { font-size: 18px; }
    .cashup .submit button { padding: 12px 14px; font-size: 13px; }

    /* Z-report */
    .zrep { padding: 14px; }
    .zrep-card { padding: 18px 14px; }
    .zrep .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
    .zrep .k { padding: 10px; }
    .zrep .k .v { font-size: 18px; }
    .zrep .tbl { font-size: 11.5px; }
    .zrep .tbl th, .zrep .tbl td { padding: 6px; }
    .zrep .sec { margin-top: 16px; }
    .zrep .ftr { flex-direction: column; }
    .zrep .ftr button { width: 100%; padding: 11px; }
    /* Tables scroll horizontally if needed */
    .zrep .sec .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* Modals as bottom sheets */
    .modal-scrim { padding: 0; align-items: flex-end; }
    .modal {
      max-width: 100%;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      animation: sheetIn 260ms cubic-bezier(0.2, 0, 0.1, 1);
      padding-bottom: calc(22px + env(safe-area-inset-bottom));
    }
    @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal .otp { gap: 6px; }

    /* Toast: shift below pk-nav */
    .toast-host { top: 64px; right: 12px; left: 12px; }
    .toast { font-size: 12.5px; padding: 9px 12px; }

    /* Hide nav badge on side rail since side is gone */
    .pd-nav-item .tag { display: none; }
  }

  @media (max-width: 380px) {
    .sale .grid { grid-template-columns: repeat(2, 1fr); }
    .sale .tile .sw { height: 52px; }
    .tender .due .am { font-size: 36px; }
    .tender .mgrid { grid-template-columns: 1fr; }
    .tender .keypad button { height: 38px; font-size: 14px; }
  }

  /* === Login screen === */
  .login-shell {
    position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(135deg, #0F1115 0%, #1A1F2E 100%);
    display: grid; place-items: center; padding: 20px;
    color: #fff;
  }
  body.is-fullscreen .login-shell { z-index: 9999; }
  .login-card {
    width: 100%; max-width: 380px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 28px;
    backdrop-filter: blur(20px);
  }
  .login-card .brand-line { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .login-card .brand-line .m { color: #fff; }
  .login-card .brand-line .nm { font: 600 17px/1 var(--font-sans); color: #fff; }
  .login-card .brand-line .sb { font: 12px/1 var(--font-sans); color: rgba(255,255,255,0.55); margin-top: 2px; }
  .login-card .device-id { font: 500 11px/1.4 var(--font-mono); color: rgba(255,255,255,0.5); padding: 8px 12px; background: rgba(255,255,255,0.04); border-radius: 7px; margin-bottom: 18px; display: flex; justify-content: space-between; gap: 8px; }
  .login-card .device-id .v { color: rgba(255,255,255,0.85); }
  .login-card h2 { font: 600 19px/1.2 var(--font-sans); color: #fff; margin: 0 0 4px; }
  .login-card .sub { font: 13.5px/1.4 var(--font-sans); color: rgba(255,255,255,0.6); margin: 0 0 18px; }
  .login-card .cashier-row { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 16px; cursor: pointer; transition: background 120ms; }
  .login-card .cashier-row:hover { background: rgba(255,255,255,0.09); }
  .login-card .cashier-row.on { background: var(--brand); }
  .login-card .cashier-row .av { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.12); color: #fff; display: grid; place-items: center; font: 600 14px var(--font-sans); flex: none; }
  .login-card .cashier-row.on .av { background: rgba(255,255,255,0.25); }
  .login-card .cashier-row .nm { font: 500 14px/1.2 var(--font-sans); color: #fff; }
  .login-card .cashier-row .sb { font: 11.5px/1.3 var(--font-sans); color: rgba(255,255,255,0.55); margin-top: 2px; }
  .login-card .cashier-row .ar { margin-left: auto; color: rgba(255,255,255,0.4); }
  .login-card .pin-area { padding: 14px 0 6px; }
  .login-card .pin-area .otp { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .login-card .pin-area .otp input { background: rgba(255,255,255,0.06); color: #fff; border-color: rgba(255,255,255,0.18); }
  .login-card .pin-area .otp input:focus { border-color: var(--brand); background: rgba(11,93,240,0.2); box-shadow: 0 0 0 3px rgba(11,93,240,0.25); }
  .login-card .pin-area .otp input[aria-invalid="true"] { border-color: var(--tone-danger); background: rgba(225,29,72,0.18); animation: shake 350ms; }
  .login-card .pin-area .acts { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
  .login-card .pin-area .acts .btn-ghost { color: rgba(255,255,255,0.7); }
  .login-card .pin-area .acts .btn-ghost:hover { color: #fff; background: rgba(255,255,255,0.08); border-color: transparent; }
  .login-card .remember { display: flex; align-items: center; gap: 8px; padding: 12px 0 0; cursor: pointer; }
  .login-card .remember input { width: 16px; height: 16px; accent-color: var(--brand); }
  .login-card .remember span { font: 12.5px/1.3 var(--font-sans); color: rgba(255,255,255,0.7); }
  .login-card .pin-err { color: var(--tone-danger); font: 500 12px/1.4 var(--font-sans); text-align: center; margin-top: 6px; min-height: 16px; }
  .login-card .skip { text-align: center; font: 12px/1.4 var(--font-sans); color: rgba(255,255,255,0.45); margin-top: 16px; }
  .login-card .skip a { color: rgba(255,255,255,0.7); text-decoration: underline; cursor: pointer; }
  .login-shell .foot { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font: 11px/1.4 var(--font-sans); color: rgba(255,255,255,0.4); }
  .login-shell .foot strong { color: rgba(255,255,255,0.6); }

  /* === Generic centered card screen (open till, etc.) === */
  .screen-center { width: 100%; padding: 28px; overflow-y: auto; display: grid; place-items: start center; min-height: 0; }
  .screen-card { width: 100%; max-width: 540px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
  .screen-card h2 { font: 700 20px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 4px; }
  .screen-card .lede { font: 13.5px/1.45 var(--font-sans); color: var(--text-muted); margin: 0 0 18px; }
  .screen-card .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .screen-card .field label { font: 500 12px/1 var(--font-sans); letter-spacing: 0.04em; color: var(--text-strong); }
  .screen-card .field input, .screen-card .field select, .screen-card .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font: 500 14px var(--font-sans); color: var(--text-body); background: var(--surface); }
  .screen-card .field input:focus, .screen-card .field select:focus, .screen-card .field textarea:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .screen-card .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .screen-card .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  .screen-card .actions button { padding: 11px 18px; border-radius: 8px; font: 600 13.5px/1 var(--font-sans); cursor: pointer; }
  .screen-card .actions .ok { background: var(--brand); color: #fff; }
  .screen-card .actions .ok:hover { background: var(--brand-strong); }
  .screen-card .actions .ok:disabled { opacity: 0.5; cursor: not-allowed; }
  .screen-card .actions .alt { background: var(--surface-muted); color: var(--text-strong); }
  .screen-card .actions .alt:hover { background: var(--surface-sunken); }
  .screen-card .toggles { display: grid; gap: 8px; margin: 14px 0; }
  .screen-card .tog { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface-muted); border-radius: 9px; cursor: pointer; }
  .screen-card .tog:hover { background: var(--surface-sunken); }
  .screen-card .tog .ic { width: 32px; height: 32px; border-radius: 8px; background: var(--surface); color: var(--text-strong); display: grid; place-items: center; flex: none; }
  .screen-card .tog .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .screen-card .tog .sb { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 1px; }
  .screen-card .tog .sw { margin-left: auto; width: 34px; height: 20px; border-radius: 9999px; background: var(--border-strong); position: relative; flex: none; transition: background 120ms; }
  .screen-card .tog .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 120ms; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .screen-card .tog.on .sw { background: var(--brand); }
  .screen-card .tog.on .sw::after { transform: translateX(14px); }

  /* === Settings page === */
  .settings { width: 100%; padding: 22px; overflow-y: auto; }
  .settings-wrap { max-width: 880px; margin: 0 auto; }
  .settings-grid { display: grid; grid-template-columns: 200px 1fr; gap: 22px; margin-top: 18px; }
  .settings-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; align-self: start; }
  .settings-nav button { padding: 8px 12px; text-align: left; border-radius: 6px; background: transparent; color: var(--text-body); font: 500 13px/1.3 var(--font-sans); cursor: pointer; border: 0; }
  .settings-nav button:hover { background: var(--surface-muted); color: var(--text-strong); }
  .settings-nav button.on { background: var(--brand-soft); color: var(--brand-strong); }
  .settings-pane { display: grid; gap: 16px; min-width: 0; }
  .sg-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .sg-card h3 { font: 600 14px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 4px; }
  .sg-card .sb { font: 12.5px/1.4 var(--font-sans); color: var(--text-muted); margin: 0 0 14px; }
  .sg-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border-subtle); }
  .sg-row:first-of-type { border-top: 0; padding-top: 0; }
  .sg-row .lbl { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .sg-row .desc { font: 12px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .sg-row input[type="text"], .sg-row input[type="number"], .sg-row select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; font: 500 13px var(--font-sans); color: var(--text-body); background: var(--surface); min-width: 140px; }
  .sg-row input:focus, .sg-row select:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .sg-row .sw { width: 34px; height: 20px; border-radius: 9999px; background: var(--border-strong); position: relative; cursor: pointer; transition: background 120ms; }
  .sg-row .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 120ms; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .sg-row .sw.on { background: var(--brand); }
  .sg-row .sw.on::after { transform: translateX(14px); }
  .sg-card .danger-row { padding: 10px 0; border-top: 1px solid var(--border-subtle); }
  .sg-card .danger-row button { padding: 8px 12px; border-radius: 7px; background: var(--tone-danger-bg); color: var(--tone-danger); font: 500 13px var(--font-sans); cursor: pointer; }
  .sg-card .danger-row button:hover { background: var(--tone-danger); color: #fff; }
  @media (max-width: 720px) {
    .settings { padding: 14px; }
    .settings-grid { grid-template-columns: 1fr; gap: 14px; }
    .settings-nav { flex-direction: row; overflow-x: auto; padding-bottom: 6px; position: static; }
    .settings-nav button { white-space: nowrap; }
    .sg-row { grid-template-columns: 1fr; }
    .sg-row input, .sg-row select, .sg-row .sw { justify-self: start; }
  }

  /* === Audit log === */
  .audit { width: 100%; padding: 22px; overflow-y: auto; }
  .audit-wrap { max-width: 1000px; margin: 0 auto; }
  .audit-h { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .audit-h .b-filter-chips { flex: 1; padding: 0; }
  .audit-log { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .audit-log .row { display: grid; grid-template-columns: 78px 90px 1fr auto; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--border-subtle); align-items: center; font: 13px/1.3 var(--font-sans); }
  .audit-log .row:last-child { border-bottom: 0; }
  .audit-log .row .ts { font: 500 12.5px/1 var(--font-mono); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .audit-log .row .typ { font: 500 11px/1 var(--font-sans); letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 9999px; text-align: center; }
  .audit-log .row .typ.sale { background: var(--brand-soft); color: var(--brand-strong); }
  .audit-log .row .typ.refund { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .audit-log .row .typ.void { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .audit-log .row .typ.disc { background: var(--surface-muted); color: var(--text-strong); }
  .audit-log .row .typ.shift { background: var(--tone-success-bg); color: var(--tone-success); }
  .audit-log .row .typ.cash { background: #FEF3C7; color: #92400E; }
  .audit-log .row .nm { font: 500 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .audit-log .row .meta { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .audit-log .row .v { font: 600 13px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .audit-empty { padding: 60px 20px; text-align: center; color: var(--text-muted); font: 13.5px/1.5 var(--font-sans); }
  @media (max-width: 720px) {
    .audit { padding: 14px; }
    .audit-log .row { grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; }
    .audit-log .row .ts { font-size: 11px; grid-row: 1; }
    .audit-log .row .typ { grid-row: 1; grid-column: 2; justify-self: end; }
    .audit-log .row .nm { grid-column: 1 / -1; grid-row: 2; }
    .audit-log .row .v { grid-column: 1 / -1; grid-row: 3; font-size: 12.5px; color: var(--text-muted); }
  }

  /* === Help / keyboard shortcuts === */
  .help { width: 100%; padding: 22px; overflow-y: auto; }
  .help-wrap { max-width: 880px; margin: 0 auto; }
  .help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .help-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .help-card h3 { font: 600 14px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .kbd-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font: 13px/1.3 var(--font-sans); color: var(--text-body); }
  .kbd-row + .kbd-row { border-top: 1px solid var(--border-subtle); }
  .kbd-row .keys { display: inline-flex; gap: 4px; }
  .kbd-row .keys kbd { padding: 3px 7px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; background: var(--surface-muted); font: 500 11px/1 var(--font-mono); color: var(--text-strong); }
  @media (max-width: 720px) { .help-grid { grid-template-columns: 1fr; } .help { padding: 14px; } }

  /* === Parked sales === */
  .parked { width: 100%; padding: 22px; overflow-y: auto; }
  .parked-wrap { max-width: 880px; margin: 0 auto; }
  .parked-list { display: grid; gap: 0; margin-top: 14px; }
  /* Parked rows extend .b-row-card with a small avatar + action row. */
  .b-row-card .pk-av {
    width: 38px; height: 38px; border-radius: 9px; background: var(--brand-soft);
    color: var(--brand-strong); display: grid; place-items: center;
    font: 600 11px/1 var(--font-mono); flex: none;
  }
  .b-row-card .pk-acts { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; }
  .b-row-card .pk-acts button { padding: 7px 12px; border-radius: 7px; font: 500 12.5px/1 var(--font-sans); cursor: pointer; }
  .b-row-card .pk-acts .ok { background: var(--brand); color: #fff; }
  .b-row-card .pk-acts .ok:hover { background: var(--brand-strong); }
  .b-row-card .pk-acts .alt { background: var(--surface-muted); color: var(--text-strong); }
  @media (max-width: 720px) { .parked { padding: 14px; } }

  /* === Offline queue === */
  .offline-banner {
    background: var(--tone-warn);
    color: #fff;
    padding: 8px 16px;
    font: 500 12.5px/1.3 var(--font-sans);
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .offline-banner .badge { padding: 2px 8px; border-radius: 9999px; background: rgba(0,0,0,0.15); font: 600 11px/1 var(--font-mono); }
  .offline-banner .spacer { flex: 1; }
  .offline-banner button { background: rgba(255,255,255,0.18); color: #fff; padding: 4px 10px; border-radius: 6px; font: 500 12px/1 var(--font-sans); cursor: pointer; }
  .offline-banner button:hover { background: rgba(255,255,255,0.28); }

  /* === Day open/closed indicator === */
  .day-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 9999px; font: 500 11.5px/1 var(--font-sans); }
  .day-pill.open { background: var(--tone-success-bg); color: var(--tone-success); }
  .day-pill.closed { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .day-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* === Stat strip (small dashboards on screens) === */
  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat-strip .s { padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .stat-strip .s .l { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
  .stat-strip .s .v { font: 700 18px/1.1 var(--font-mono); color: var(--text-strong); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat-strip .s .d { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }

  /* Split tender stack */
  .split-stack { display: grid; gap: 8px; }
  .split-row { display: grid; grid-template-columns: 24px 1fr 110px 32px; gap: 8px; padding: 10px 12px; background: var(--surface-muted); border-radius: 8px; align-items: center; }
  .split-row .ic { color: var(--text-strong); }
  .split-row .nm { font: 500 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .split-row input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font: 600 13px var(--font-mono); text-align: right; background: var(--surface); }
  .split-row input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .split-row .rm { background: transparent; color: var(--tone-danger); cursor: pointer; width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; }
  .split-row .rm:hover { background: var(--tone-danger-bg); }
  .split-add { display: flex; gap: 6px; flex-wrap: wrap; }
  .split-add button { padding: 6px 10px; border-radius: 7px; background: var(--surface); border: 1px dashed var(--border); font: 500 12px/1 var(--font-sans); color: var(--text-strong); cursor: pointer; }
  .split-add button:hover { background: var(--surface-muted); border-style: solid; }
  .split-tot { padding: 10px 12px; background: var(--brand-soft); color: var(--brand-strong); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font: 500 13px var(--font-sans); }
  .split-tot.short { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .split-tot.over { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .split-tot .v { font: 700 16px var(--font-mono); }

  /* Tone badges */
  .tone-badge { padding: 3px 8px; border-radius: 9999px; font: 600 10.5px/1 var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; }
  .tone-badge.success { background: var(--tone-success-bg); color: var(--tone-success); }
  .tone-badge.danger { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .tone-badge.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .tone-badge.muted { background: var(--surface-muted); color: var(--text-muted); }

  /* === Item lookup (redesigned) ===
     Compact row design — sign-in card aesthetic. */
  .ilk { width: 100%; padding: 22px; overflow-y: auto; min-width: 0; }
  .ilk-wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .ilk-search {
    display: flex; align-items: center; gap: 8px;
    padding: 0 6px 0 14px; height: 48px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 9999px;
    box-shadow: var(--shadow-rest);
    transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .ilk-search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px var(--focus-ring-soft); }
  .ilk-search > [data-icon] { color: var(--text-subtle); flex: none; }
  .ilk-search input {
    flex: 1; border: 0; outline: 0; background: transparent;
    font: 400 15px/1.4 var(--font-sans); color: var(--text-body);
    padding: 0;
  }
  .ilk-search input::placeholder { color: var(--text-subtle); }
  .ilk-search .scan {
    height: 36px; padding: 0 14px; border-radius: 9999px;
    background: var(--surface-muted); color: var(--text-strong);
    display: inline-flex; align-items: center; gap: 6px;
    font: 500 13px/1 var(--font-sans); cursor: pointer; flex: none;
    border: 0;
  }
  .ilk-search .scan:hover { background: var(--surface-sunken); }

  .ilk-meta {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .ilk-meta .ct {
    font: 500 12.5px/1 var(--font-mono); color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .ilk-meta .b-filter-chips { margin-left: auto; padding: 0; flex-wrap: wrap; }

  .ilk-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    overflow: hidden;
    box-shadow: var(--shadow-rest);
  }
  .ilk-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
    transition: background-color var(--dur-fast) var(--ease-out);
    background: transparent;
    width: 100%;
    text-align: left;
    border-left: 0; border-right: 0; border-top: 0;
  }
  .ilk-row:last-child { border-bottom: 0; }
  .ilk-row:hover { background: var(--surface-muted); }
  .ilk-row .thumb {
    width: 44px; height: 44px; border-radius: var(--radius-lg);
    display: grid; place-items: center; flex: none;
    font: 700 13px/1 var(--font-mono);
    background: var(--surface-muted); color: var(--text-strong);
    letter-spacing: -0.01em;
  }
  .ilk-row.bev .thumb { background: var(--brand-soft); color: var(--brand-strong); }
  .ilk-row.gro .thumb { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .ilk-row.tob .thumb { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .ilk-row.cln .thumb { background: var(--tone-success-bg); color: var(--tone-success); }
  .ilk-row.bak .thumb { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .ilk-row.snk .thumb { background: var(--brand-soft); color: var(--brand-strong); }
  .ilk-row .body { min-width: 0; }
  .ilk-row .nm { font: 500 14.5px/1.35 var(--font-sans); color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; }
  .ilk-row .meta {
    display: inline-flex; align-items: center; gap: 8px;
    font: 12.5px/1.3 var(--font-mono); color: var(--text-muted);
    margin-top: 4px; font-variant-numeric: tabular-nums; flex-wrap: wrap;
  }
  .ilk-row .meta .sep { color: var(--text-subtle); }
  .ilk-row .meta .status-dot { font-family: var(--font-sans); font-size: 12px; }
  .ilk-row .price {
    font: 600 15px/1 var(--font-mono); color: var(--text-strong);
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .ilk-row .add {
    width: 36px; height: 36px; border-radius: var(--radius-lg);
    background: var(--brand-soft); color: var(--brand-strong);
    display: grid; place-items: center; flex: none; cursor: pointer; border: 0;
    transition: all var(--dur-fast) var(--ease-out);
  }
  .ilk-row .add:hover { background: var(--brand); color: #fff; }
  .ilk-row.oos { opacity: 0.55; cursor: not-allowed; }
  .ilk-row.oos .add { background: var(--surface-muted); color: var(--text-subtle); cursor: not-allowed; }
  .ilk-row.oos .add:hover { background: var(--surface-muted); color: var(--text-subtle); }

  .ilk-empty {
    padding: 56px 20px; text-align: center; color: var(--text-muted);
    font: 14px/1.5 var(--font-sans);
  }
  .ilk-empty .ic { width: 48px; height: 48px; border-radius: var(--radius-xl); background: var(--surface-muted); color: var(--text-subtle); display: inline-grid; place-items: center; margin-bottom: 10px; }
  .ilk-empty .ttl { font: 600 15px/1.3 var(--font-sans); color: var(--text-strong); }
  .ilk-empty .sub { margin-top: 4px; }

  /* Item detail sheet uses .x-bottom-sheet — hero/thumb/grid are local scope only */
  .x-bottom-sheet .ilk-hero { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .x-bottom-sheet .ilk-hero .thumb-lg {
    width: 64px; height: 64px; border-radius: var(--radius-xl);
    background: var(--surface-muted); color: var(--text-strong);
    display: grid; place-items: center;
    font: 700 18px/1 var(--font-mono);
  }
  .x-bottom-sheet .ilk-hero h3 { margin: 0; font: 600 16px/1.3 var(--font-sans); color: var(--text-strong); }
  .x-bottom-sheet .ilk-hero .sb { font: 13px/1.4 var(--font-mono); color: var(--text-muted); margin-top: 4px; }
  .x-bottom-sheet .ilk-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .x-bottom-sheet .ilk-grid .cell {
    padding: 12px 14px; background: var(--surface-muted); border-radius: var(--radius-lg);
  }
  .x-bottom-sheet .ilk-grid .lbl { font: 500 11px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .x-bottom-sheet .ilk-grid .v { font: 600 15px/1.2 var(--font-mono); color: var(--text-strong); margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* === My reports (cashier-scoped) === */
  .mrep { width: 100%; padding: 22px; overflow-y: auto; min-width: 0; }
  .mrep-wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .mrep-hero {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-strong) 100%);
    color: #fff;
    border-radius: var(--radius-xl);
    padding: 24px 26px;
    display: flex; align-items: center; gap: 18px;
    position: relative; overflow: hidden;
  }
  .mrep-hero::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(80% 200% at 100% 0%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 60%);
    pointer-events: none;
  }
  .mrep-hero .av {
    width: 56px; height: 56px; border-radius: var(--radius-xl);
    background: rgba(255,255,255,0.18); color: #fff;
    display: grid; place-items: center; font: 600 18px/1 var(--font-sans);
    flex: none; backdrop-filter: blur(8px);
    position: relative; z-index: 1;
  }
  .mrep-hero .meta { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .mrep-hero .eyebrow { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
  .mrep-hero h2 { margin: 6px 0 4px; font: 700 22px/1.2 var(--font-sans); color: #fff; }
  .mrep-hero .sb { font: 13.5px/1.4 var(--font-sans); color: rgba(255,255,255,0.8); }
  .mrep-hero .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 9999px;
    background: rgba(255,255,255,0.18); color: #fff;
    font: 500 12px/1 var(--font-mono); font-variant-numeric: tabular-nums;
    margin-top: 8px;
    position: relative; z-index: 1;
  }
  .mrep-hero .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #9CC290; box-shadow: 0 0 8px #9CC290; }

  .mrep-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .mrep-tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--card-radius); padding: 16px 18px;
    box-shadow: var(--shadow-rest);
  }
  .mrep-tile .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
  .mrep-tile .v { font: 700 22px/1.1 var(--font-mono); color: var(--text-strong); margin-top: 10px; font-variant-numeric: tabular-nums; }
  .mrep-tile .d { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 4px; }
  .mrep-tile.brand .v { color: var(--brand-strong); }

  .mrep-row2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
  .mrep-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--card-radius); padding: 18px 20px;
    box-shadow: var(--shadow-rest);
  }
  .mrep-card .ch { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .mrep-card .ch h3 { margin: 0; font: 600 14px/1.3 var(--font-sans); color: var(--text-strong); }
  .mrep-card .ch .meta { font: 11.5px/1 var(--font-mono); color: var(--text-muted); }

  .mrep-bars { display: flex; flex-direction: column; gap: 10px; }
  .mrep-bar { display: grid; grid-template-columns: 24px 1fr 80px; align-items: center; gap: 12px; }
  .mrep-bar .rk { font: 600 12px/1 var(--font-mono); color: var(--text-subtle); }
  .mrep-bar .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrep-bar .nm .qty { font: 500 11.5px/1.3 var(--font-mono); color: var(--text-muted); margin-left: 6px; }
  .mrep-bar .bar { height: 6px; background: var(--surface-muted); border-radius: 9999px; margin-top: 6px; overflow: hidden; }
  .mrep-bar .bar > span { display: block; height: 100%; background: var(--brand); border-radius: 9999px; transition: width var(--dur-base) var(--ease-out); }
  .mrep-bar .v { font: 600 13px/1 var(--font-mono); color: var(--text-strong); text-align: right; font-variant-numeric: tabular-nums; }

  .mrep-mix { display: flex; flex-direction: column; gap: 12px; }
  .mrep-mix-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
  .mrep-mix-row .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; flex: none; }
  .mrep-mix-row .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .mrep-mix-row .bar { height: 4px; background: var(--surface-muted); border-radius: 9999px; margin-top: 4px; overflow: hidden; }
  .mrep-mix-row .bar > span { display: block; height: 100%; background: var(--brand); border-radius: 9999px; }
  .mrep-mix-row .v { font: 600 12.5px/1 var(--font-mono); color: var(--text-strong); text-align: right; }
  .mrep-mix-row .v .pct { display: block; font: 500 10.5px/1 var(--font-mono); color: var(--text-muted); margin-top: 3px; }

  .mrep-spark {
    display: flex; align-items: flex-end;
    gap: 4px; height: 92px; padding-top: 10px;
  }
  .mrep-spark .bar {
    flex: 1; background: var(--brand-soft); border-radius: 4px 4px 2px 2px;
    min-height: 4px; position: relative;
  }
  .mrep-spark .bar.peak { background: var(--brand); }
  .mrep-spark .bar > .v { display: none; }
  .mrep-spark-axis { display: flex; gap: 4px; margin-top: 6px; font: 10px/1 var(--font-mono); color: var(--text-subtle); }
  .mrep-spark-axis > span { flex: 1; text-align: center; }

  .mrep-var {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-radius: var(--card-radius);
  }
  .mrep-var.ok { background: var(--tone-success-bg); color: var(--tone-success); }
  .mrep-var.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .mrep-var.bad { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .mrep-var .ic { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.5); color: currentColor; display: grid; place-items: center; flex: none; }
  body.is-dark .mrep-var .ic { background: rgba(0,0,0,0.30); }
  .mrep-var .ttl { font: 600 14px/1.3 var(--font-sans); }
  .mrep-var .sb { font: 12.5px/1.4 var(--font-sans); opacity: 0.85; margin-top: 2px; }
  .mrep-var .v { margin-left: auto; font: 700 18px/1 var(--font-mono); }

  .mrep-foot {
    text-align: center; padding: 14px 0 4px;
    font: 13px/1.4 var(--font-sans); color: var(--text-muted);
  }
  .mrep-foot a { color: var(--brand-strong); cursor: pointer; }
  .mrep-foot a:hover { text-decoration: underline; }

  @media (max-width: 1000px) {
    .mrep-tiles { grid-template-columns: 1fr 1fr; }
    .mrep-row2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .mrep { padding: 14px; }
    .mrep-hero { padding: 18px; flex-direction: column; align-items: flex-start; gap: 12px; }
    .mrep-hero h2 { font-size: 18px; }
    .mrep-tiles { grid-template-columns: 1fr 1fr; gap: 8px; }
    .mrep-tile { padding: 12px 14px; }
    .mrep-tile .v { font-size: 18px; margin-top: 6px; }
    .mrep-card { padding: 14px 16px; }
    .ilk { padding: 14px; }
    .ilk-search { height: 44px; padding: 0 4px 0 12px; }
    .ilk-search .scan { height: 32px; padding: 0 10px; font-size: 12px; }
    .ilk-row { padding: 12px 14px; gap: 10px; }
    .ilk-row .thumb { width: 38px; height: 38px; font-size: 11px; }
    .ilk-row .nm { font-size: 13.5px; }
    .ilk-row .price { font-size: 13.5px; }
    .ilk-row .add { width: 32px; height: 32px; }
  }

  /* ===========================================================
     PHONE (≤ 720px) — aggressive density pass (POS)
     Tighter spacing, smaller typography, full-height sheets,
     safe-area insets, no horizontal overflow at 320–430 px.
     Scoped under body[data-kit-nav="pos"].
     =========================================================== */
  @media (max-width: 720px) {
    /* === Top bar — safe-area + tighter === */
    body[data-kit-nav="pos"] .pd-bar { padding-top: env(safe-area-inset-top); height: calc(44px + env(safe-area-inset-top)); }

    /* === Page gutters (16→12) === */
    body[data-kit-nav="pos"] .page { padding: 12px; gap: 10px; }
    body[data-kit-nav="pos"] .splitp .pane { padding: 12px; }
    body[data-kit-nav="pos"] .sale .cat-bar { padding: 10px 12px; }
    body[data-kit-nav="pos"] .sale .b-filter-chips { padding: 8px 12px; gap: 6px; }
    body[data-kit-nav="pos"] .sale .grid { padding: 10px 12px calc(80px + env(safe-area-inset-bottom)); gap: 8px; }
    body[data-kit-nav="pos"] .receipt-page { padding: 12px; }
