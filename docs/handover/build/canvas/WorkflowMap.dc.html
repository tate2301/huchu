<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Retail workflows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} .wl:hover{text-decoration-color:#24140e} .wl:focus-visible{outline:2px solid #e8620f;outline-offset:3px}</style>
</helmet>
<div style="width: 1440px; min-height: {{height}}; box-sizing: border-box; padding: 56px 64px; background: #ffffff; color: #24140e; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px;">
  <header style="display: flex; align-items: flex-end; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 10px; flex: 1;">
      <span style="font-size: 14px; font-weight: 500; color: #75675f;">Area <span style="font-family: 'IBM Plex Mono', monospace;">{{num}}</span> of 8</span>
      <h2 style="margin: 0; font-size: 36px; line-height: 1.08; font-weight: 600; letter-spacing: -0.03em;">{{title}}</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4a3a33; max-width: 820px;">{{lede}}</p>
    </div>
    <div style="display: flex; gap: 8px; font-size: 13px;">
      <span style="height: 26px; padding: 0 10px; border-radius: 6px; background: #f3eee9; display: flex; align-items: center; gap: 6px;"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">{{count}}</span> workflows</span>
      <span style="height: 26px; padding: 0 10px; border-radius: 6px; background: #f3eee9; display: flex; align-items: center; gap: 6px;"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">{{guided}}</span> guided</span>
      <span style="height: 26px; padding: 0 10px; border-radius: 6px; background: #f3eee9; display: flex; align-items: center; gap: 6px;"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">{{built}}</span> on the canvas</span>
    </div>
  </header>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
    <sc-for list="{{flows}}" as="w" hint-placeholder-count="8">
      <article style="border: 1px solid #ece6e0; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #75675f;">{{w.id}}</span>
          <h3 style="margin: 0; flex: 1; font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">{{w.name}}</h3>
          <sc-if value="{{w.guided}}" hint-placeholder-val="{{ false }}"><span style="height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid #f0c7a6; color: #a8420c; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 5px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 14.6 8.6 21.5 9.2 16.2 13.7 17.9 20.5 12 16.8 6.1 20.5 7.8 13.7 2.5 9.2 9.4 8.6z"></path></svg>Guided</span></sc-if>
          <span style="height: 22px; padding: 0 8px; border-radius: 6px; background: {{w.stateBg}}; color: {{w.stateFg}}; font-size: 12px; font-weight: 500; display: flex; align-items: center;">{{w.state}}</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: #75675f;"><span>Who: <span style="color: #24140e;">{{w.who}}</span></span><span>Starts from: <span style="color: #24140e;">{{w.from}}</span></span></div>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px;">
          <sc-for list="{{w.steps}}" as="s" hint-placeholder-count="4">
            <li style="display: flex; align-items: center; gap: 6px;"><span style="height: 26px; padding: 0 10px; border-radius: 99px; background: #faf7f4; border: 1px solid #ece6e0; display: flex; align-items: center; gap: 6px; white-space: nowrap;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #75675f;">{{s.n}}</span>{{s.label}}</span><sc-if value="{{s.more}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a89c94" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></sc-if></li>
          </sc-for>
        </ol>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 13px; padding-top: 10px; border-top: 1px solid #f3eee9;">
          <span style="color: #75675f;">Screens</span>
          <sc-for list="{{w.screens}}" as="x" hint-placeholder-count="2"><a href="{{x.href}}" class="wl" style="color: #24140e; text-decoration: underline; text-decoration-color: #ddd4cc; text-underline-offset: 3px;">{{x.label}}</a></sc-for>
          <sc-if value="{{w.todo}}" hint-placeholder-val="{{ false }}"><span style="color: #a89c94;">{{w.todoText}}</span></sc-if>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
