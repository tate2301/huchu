<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Shifts on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #ffffff; color: #24140e; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-size: 14px;">
  <header style="height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid #ece6e0;">
    <button aria-label="Open the menu" style="width: 44px; height: 44px; border: 0; background: transparent; color: #4a3a33; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5h18V8H3zm0 5.25h18v2.5H3zM3 16h18v2.5H3z"></path></svg></button>
    <h1 style="margin: 0; flex: 1; font-size: 16px; font-weight: 600;">Shifts</h1>
    <button aria-label="Open shift" style="width: 44px; height: 44px; border: 0; background: transparent; color: #e8620f; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.75 4h2.5v6.75H20v2.5h-6.75V20h-2.5v-6.75H4v-2.5h6.75z"></path></svg></button>
  </header>
  <div role="toolbar" aria-label="Shifts" style="height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #ece6e0;">
    <label style="flex: 1; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #ddd4cc; border-radius: 8px; color: #75675f; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.23-1.42 1.42-4.23-4.24A7.5 7.5 0 1 1 10.5 3zm0 2.5a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"></path></svg><input aria-label="Search shifts" placeholder="Search shifts" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; background: transparent;"></label>
    <button style="height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #ddd4cc; border-radius: 8px; background: #f3eee9; color: #24140e; font: inherit; font-weight: 500;">Filters<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px;">1</span></button>
  </div>
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
      <a href="#" style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid #f3eee9; color: inherit; text-decoration: none;">
        <span style="display: flex; align-items: center; gap: 8px; min-width: 0;"><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.cashier}}</span><span style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 500; background: {{row.bg}}; color: {{row.fg}};"><span style="width: 7px; height: 7px; box-sizing: border-box; border-radius: 99px; background: {{row.dot}}; border: 1.5px solid {{row.ring}};"></span>{{row.state}}</span></span>
        <span style="text-align: right; font-family: 'IBM Plex Mono', monospace; font-weight: 500;">{{row.takings}}</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #75675f;">{{row.meta}}</span>
        <span style="text-align: right;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; padding: 1px 5px; border-radius: 6px; background: {{row.varBg}}; color: {{row.varFg}};">{{row.variance}}</span></span>
      </a>
    </sc-for>
  </div>
  <div style="flex: none; box-shadow: 0 -1px 0 #ddd4cc, 0 -10px 18px -14px rgba(11,12,20,0.35);">
    <div style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #faf7f4; font-size: 13px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">312</span><span style="flex: 1;"></span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">US$71,904.35</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #a3122f;">−US$186.42</span>
    </div>
    <nav aria-label="Pages" style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-top: 1px solid #ece6e0; background: #ffffff;">
      <button aria-label="Previous page" style="width: 44px; height: 44px; border: 0; background: transparent; color: #4a3a33; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
      <span style="flex: 1; text-align: center; color: #4a3a33;"><span style="font-family: 'IBM Plex Mono', monospace; color: #24140e;">1</span> of <span style="font-family: 'IBM Plex Mono', monospace;">7</span></span>
      <button aria-label="Next page" style="width: 44px; height: 44px; border: 0; background: transparent; color: #4a3a33; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      <button aria-label="Back to top" style="width: 44px; height: 44px; border: 1px solid #ece6e0; border-radius: 8px; background: #ffffff; color: #24140e; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var S = {
      Open: ['#eceefb', '#3d4fb8', '#3d4fb8'],
      Short: ['#fbe8ec', '#a3122f', '#a3122f'],
      Over: ['#fbf1dc', '#8a5a10', '#e0a21a'],
      Balanced: ['transparent', '#75675f', 'transparent']
    };
    var raw = [
      ['Chipo Dube', 'Open', 'SH-00242 · Front · 6h 12m live', 'US$41.50', '—'],
      ['Farai Moyo', 'Open', 'SH-00240 · Back · 52h 50m', 'US$72.95', '—'],
      ['Chipo Dube', 'Over', 'SH-00241 · Back · 18 Aug', 'US$7.20', '+US$42.80'],
      ['Tafara Nyathi', 'Balanced', 'SH-00239 · Front · 16 Aug', 'US$236.75', 'US$0.00'],
      ['Chipo Dube', 'Short', 'SH-00238 · Front · 15 Aug', 'US$886.85', '−US$7.15'],
      ['Farai Moyo', 'Balanced', 'SH-00237 · Front · 15 Aug', 'US$655.40', 'US$0.00'],
      ['Farai Moyo', 'Short', 'SH-00236 · Back · 14 Aug', 'US$695.10', '−US$8.14'],
      ['Chipo Dube', 'Over', 'SH-00235 · Front · 14 Aug', 'US$303.70', '+US$3.17'],
      ['Chipo Dube', 'Balanced', 'SH-00234 · Front · 13 Aug', 'US$385.45', 'US$0.00']
    ];
    return {
      rows: raw.map(function (r) {
        var s = S[r[1]];
        var v = r[4];
        var vb = 'transparent', vf = '#75675f';
        if (v.charAt(0) === '−') { vb = '#fbe8ec'; vf = '#a3122f'; }
        else if (v.charAt(0) === '+') { vb = '#fbf1dc'; vf = '#8a5a10'; }
        else if (v === '—') { vf = '#a89c94'; }
        return { cashier: r[0], state: r[1], meta: r[2], takings: r[3], variance: v, bg: s[0], fg: s[1], dot: s[2], ring: s[2] === 'transparent' ? '#75675f' : s[2], varBg: vb, varFg: vf };
      })
    };
  }
}
</script>
</body>
</html>
