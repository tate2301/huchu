packages:
  - apps/*
  - packages/*
  - packages/modules/*
  # A client's own module, when a contract pays for one: composed only into that client's host.
  - packages/modules/private/*
allowBuilds:
  '@prisma/engines': true
  core-js: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@corelithzw/react@0.3.2 || 0.3.3 || 0.3.4 || 0.4.0'
# The design system used to be overridden to `link:../corelith-design-docs`, so
# package changes landed here without a publish. That sibling checkout only
# exists on the machine it was developed on: anywhere else — CI, Vercel, a
# fresh clone — the link resolves to nothing and the install either fails or
# leaves the previous version in place, which is what the build was failing on.
# 0.4.0 is published, so the range in package.json is enough. Bring the
# override back only behind a local-only override file, never in the one the
# deploy reads.
